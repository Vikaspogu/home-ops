---
ignore: |
  .ansible/
  .direnv/
  .private/
  .vscode/
  *.sops.*
  **/charts/**
  components/ai/openshell/vendor/**
  ansible/roles/xanmanning.k3s/

extends: default

rules:
  document-start: disable

  truthy:
    allowed-values: ["true", "false", "on"]

  comments:
    min-spaces-from-content: 1

  line-length: disable

  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0

  indentation:
    indent-sequences: whatever
