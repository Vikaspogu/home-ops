---
# AVAGO 3108 rejects GPT on JBOD, so backup-garage uses an all-disk RAID-0 VD pinned to its controller WWID; sdj is reserved and PI must be stripped before creating VDs.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: backup-garage
provisioning:
  diskSelector:
    match: disk.wwid == 'naa.6003048018df230131c997a634685c1d'
  minSize: 100GB
  grow: true
filesystem:
  type: xfs
