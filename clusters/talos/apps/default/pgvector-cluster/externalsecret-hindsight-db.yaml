---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hindsight-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # CNPG managed roles require both username and password keys.
        username: hindsight
        password: "{{ .POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: hindsight
