applications:
  argo-cd:
    annotations:
      argocd.argoproj.io/sync-wave: "20"
    destination:
      namespace: argo-system
    source:
      path: components/argo-system/argo-cd

  actual:
    annotations:
      argocd.argoproj.io/sync-wave: "20"
    destination:
      namespace: default
    source:
      path: components/default/actual
      plugin:
        env:
          - name: STORAGE_CLASS
            value: ceph-block
          - name: VOLSYNC_STORAGE_CLASS
            value: ceph-block-volsync
          - name: VOLUME_SNAPSHOT_CLASS
            value: csi-ceph-blockpool
          - name: VOLSYNC_CAPACITY
            value: 5Gi
          - name: VOLSYNC_CACHE_CAPACITY
            value: 8Gi
          - name: VOLSYNC_SCHEDULE
            value: "0 0,6,12,18 * * *"

