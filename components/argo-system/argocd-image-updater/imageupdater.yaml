---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: gitea-apps
  namespace: argo-system
spec:
  commonUpdateSettings:
    updateStrategy: latest
    allowTags: 'regexp:^[0-9]{14}-[a-f0-9]{7}-oci$'
    ignoreTags:
      - latest
  writeBackConfig:
    method: "git:secret:argo-system/git-creds"
    gitConfig:
      branch: main
  applicationRefs:
    - namePattern: "ivan-dashboard"
      writeBackConfig:
        method: "git:secret:argo-system/git-creds"
        gitConfig:
          branch: main
          writeBackTarget: "helmvalues:./values.yaml"
      images:
        - alias: ivan-personal-dashboard
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/ivan-personal-dashboard-v2"
          manifestTargets:
            helm:
              name: controllers.app.containers.app.image.repository
              tag: controllers.app.containers.app.image.tag
    - namePattern: "ivan-personal-service"
      writeBackConfig:
        method: "git:secret:argo-system/git-creds"
        gitConfig:
          branch: main
          writeBackTarget: "helmvalues:./values.yaml"
      images:
        - alias: ivan-personal-service
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/ivan-personal-service"
          manifestTargets:
            helm:
              name: controllers.app.containers.app.image.repository
              tag: controllers.app.containers.app.image.tag
    - namePattern: forge-orchestrator
      writeBackConfig:
        method: "git:secret:argo-system/git-creds"
        gitConfig:
          branch: main
          writeBackTarget: "helmvalues:./values.yaml"
      images:
        # forge-backend is pinned MANUALLY (spec 2026-09-03 rollout discipline):
        # the updater's tag list for it comes back empty from the registry, so
        # it never selects a newer tag — but its write-back would still clobber
        # manual pins. Keep it out of the tracked set.
        - alias: openshell-sandbox
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/openshell-sandbox:latest-oci"
          commonUpdateSettings:
            updateStrategy: digest
            forceUpdate: true
          manifestTargets:
            helm:
              spec: controllers.app.containers.app.env.FORGE_SANDBOX_IMAGE
    - namePattern: forge-dashboard
      writeBackConfig:
        method: "git:secret:argo-system/git-creds"
        gitConfig:
          branch: main
          writeBackTarget: "helmvalues:./values.yaml"
      images:
        - alias: dashboard
          imageName: gitea.${CLUSTER_DOMAIN}/vpogu/forge-dashboard
          manifestTargets:
            helm:
              name: controllers.app.containers.app.image.repository
              tag: controllers.app.containers.app.image.tag
    - namePattern: "hermes-agent"
      writeBackConfig:
        method: "git:secret:argo-system/git-creds"
        gitConfig:
          branch: main
          writeBackTarget: "helmvalues:./values.yaml"
      images:
        - alias: agent-platform-hermes-agent
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/agent-platform-hermes-agent"
          manifestTargets:
            helm:
              name: controllers.app.containers.app.image.repository
              tag: controllers.app.containers.app.image.tag
        - alias: agent-platform-hermes-agent-restore-permissions
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/agent-platform-hermes-agent"
          manifestTargets:
            helm:
              name: controllers.app.initContainers.00-restore-permissions.image.repository
              tag: controllers.app.initContainers.00-restore-permissions.image.tag
        - alias: agent-platform-hermes-agent-mcp-token-sidecar
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/agent-platform-hermes-agent"
          manifestTargets:
            helm:
              name: controllers.app.initContainers.mcp-token-sidecar.image.repository
              tag: controllers.app.initContainers.mcp-token-sidecar.image.tag
        - alias: agent-platform-hermes-agent-seed
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/agent-platform-hermes-agent"
          manifestTargets:
            helm:
              name: controllers.app.initContainers.seed-config.image.repository
              tag: controllers.app.initContainers.seed-config.image.tag
        - alias: agent-platform-hermes-agent-plugins-install
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/agent-platform-hermes-agent"
          manifestTargets:
            helm:
              name: controllers.app.initContainers.plugins-install.image.repository
              tag: controllers.app.initContainers.plugins-install.image.tag
        - alias: agent-platform-hermes-agent-ntfy
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/agent-platform-hermes-agent"
          manifestTargets:
            helm:
              name: controllers.app.initContainers.ntfy-alert-bridge.image.repository
              tag: controllers.app.initContainers.ntfy-alert-bridge.image.tag
    - namePattern: "agentmemory"
      writeBackConfig:
        method: "git:secret:argo-system/git-creds"
        gitConfig:
          branch: main
          writeBackTarget: "helmvalues:./values.yaml"
      images:
        - alias: agentmemory
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/agentmemory"
          manifestTargets:
            helm:
              name: controllers.agentmemory.containers.app.image.repository
              tag: controllers.agentmemory.containers.app.image.tag
    - namePattern: "agent-farm"
      writeBackConfig:
        method: "git:secret:argo-system/git-creds"
        gitConfig:
          branch: main
          writeBackTarget: "helmvalues:./values.yaml"
      images:
        - alias: agent-farm-api
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/agent-farm-api"
          manifestTargets:
            helm:
              name: controllers.api.containers.app.image.repository
              tag: controllers.api.containers.app.image.tag
        - alias: agent-farm-web
          imageName: "gitea.${CLUSTER_DOMAIN}/vpogu/agent-farm-web"
          manifestTargets:
            helm:
              name: controllers.web.containers.app.image.repository
              tag: controllers.web.containers.app.image.tag
