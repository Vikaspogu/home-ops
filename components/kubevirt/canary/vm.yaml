apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: kubevirt-canary
  namespace: kubevirt
spec:
  runStrategy: Manual
  template:
    spec:
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              macAddress: "02:00:00:00:05:01"
        resources:
          requests:
            cpu: "1"
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 512Mi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:44@sha256:1217dcc8c58dbc3ca08e0323929b86f609506121adb01d0fd892232f2c0544f6
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: canary
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHKi2R97fAR+Z1MqpR7140RnjVsktlq9X6NqXuc2Uo58 kubevirt-canary
              runcmd:
                - |
                  set -eu
                  if ! getent hosts kubernetes.default.svc.cluster.local >/dev/null; then
                    echo CANARY_DNS_FAILED >/dev/ttyS0
                  elif ! timeout 10 bash -c '</dev/tcp/kubernetes.default.svc.cluster.local/443'; then
                    echo CANARY_SERVICE_FAILED >/dev/ttyS0
                  elif ! timeout 10 bash -c '</dev/tcp/1.1.1.1/443'; then
                    echo CANARY_EGRESS_FAILED >/dev/ttyS0
                  else
                    echo CANARY_NETWORK_OK >/dev/ttyS0
                  fi
