apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: kubevirt-canary
  namespace: kubevirt
spec:
  runStrategy: Manual
  template:
    spec:
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              macAddress: "02:00:00:00:05:01"
        resources:
          requests:
            cpu: "1"
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 512Mi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:44@sha256:1217dcc8c58dbc3ca08e0323929b86f609506121adb01d0fd892232f2c0544f6
