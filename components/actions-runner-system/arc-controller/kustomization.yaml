  - externalsecret.yaml
  - rbac.yaml
helmCharts:
  - name: gha-runner-scale-set-controller
    releaseName: arc-controller
    namespace: actions-runner-system
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    version: "0.14.2"
    includeCRDs: true
    valuesFile: values.yaml
