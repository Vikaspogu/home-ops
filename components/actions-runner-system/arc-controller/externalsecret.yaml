apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-arc
  namespace: actions-runners
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: github-arc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        github_token: "{{ .GITHUB_ARC_TOKEN }}"
  dataFrom:
    - extract:
        key: Github
