apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-farm-api-ingress
  namespace: agent-farm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik-outpost-proxy
      ports:
        - protocol: TCP
          port: 8080
    # Forward-auth path: Envoy Gateway proxies ws-* traffic to the API after
    # the Outpost extAuth check supplies the trusted identity header.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-farm-web-ingress
  namespace: agent-farm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik-outpost-proxy
      ports:
        - protocol: TCP
          port: 3000
---
# Workspace launcher pods: Pi Web only from the API gateway; SSH open (key-gated).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-farm-workspace-ingress
  namespace: agent-farm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: agent-farm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 30141
    - ports:
        - protocol: TCP
          port: 22
