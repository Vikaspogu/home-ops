# Task-pod egress enforcement (plan rule 2: a task pod's only channels are
# the model endpoint and the agent-farm artifact/ingestion endpoint).
#
# Cilium enforces this cluster-wide (Cilium 1.20, Talos cni: none): once this
# policy selects a pod for egress, everything not allowed below is denied.
# Task pods carry the label agent-farm.io/task-pod: "true" (set by the
# agent-farm API's pod builder).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-farm-task-pods-egress
  namespace: agent-farm
spec:
  endpointSelector:
    matchLabels:
      agent-farm.io/task-pod: "true"
  egress:
    # The agent-farm API: source-bundle download, transcript ingestion,
    # result-bundle upload.
    - toEndpoints:
        - matchLabels:
            "k8s:app.kubernetes.io/component": api
            "k8s:io.kubernetes.pod.namespace": agent-farm
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # DNS: toFQDNs rules below resolve through the cluster's DNS proxy.
    - toEndpoints:
        - matchLabels:
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The model inference endpoint: the managed NVIDIA inference hub
    # (INFERENCE_HUB_BASE_URL in the 1Password "inference-hub" item — the
    # same URL the agentic settings use). The agentic settings' inference
    # URL and this rule MUST agree — pods reach exactly the hosts allowed
    # here. inference-backend is pi's model-catalog metadata host.
    - toFQDNs:
        - matchPattern: "inference-api.nvidia.com"
        - matchPattern: "inference-backend.nvidia.com"
