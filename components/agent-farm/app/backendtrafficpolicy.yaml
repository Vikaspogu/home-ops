# Redirect failed outpost callbacks to the portal root to restart login instead of stranding users on a raw 400 page.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: outpost-callback-recovery
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agent-farm-portal
      sectionName: callback
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agent-farm-auth
      sectionName: callback
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 400
      response:
        statusCode: 302
        header:
          set:
            - name: location
              value: https://portal.${CLUSTER_DOMAIN}/
