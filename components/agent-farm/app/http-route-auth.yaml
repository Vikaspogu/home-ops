# Auth endpoint host for the workspace forward_auth domain provider.
# Must be a distinct host from the portal: the outpost keys provider routing
# on external_host, and sharing one shadows the portal with a 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-farm-auth
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["agent-farm-auth.${CLUSTER_DOMAIN}"]
  rules:
    # Named so the outpost-callback-recovery policy can target just this rule.
    - name: callback
      matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/callback
      backendRefs:
        - name: ak-outpost-agent-farm
          port: 9000
    - backendRefs:
        - name: ak-outpost-agent-farm
          port: 9000
