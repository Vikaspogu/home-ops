apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-farm-api
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete"]
  # Setup bundles (per-owner) and per-workspace cloud-init user data.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["create", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/start", "virtualmachines/stop", "virtualmachines/restart"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-farm-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-farm-api
subjects:
  - kind: ServiceAccount
    name: agent-farm
