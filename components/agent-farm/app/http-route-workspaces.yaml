apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-farm-workspaces
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  # Catch otherwise-unclaimed ws-<id> hosts; exact hosts take precedence, while unsupported wildcards also break the UniFi external-dns webhook.
  rules:
    # SSH-over-WebSocket uses an agent token at the gateway, skips browser forward-auth, and still enforces ownership.
    - name: ssh
      matches:
        - path:
            type: PathPrefix
            value: /ssh
      backendRefs:
        - name: agent-farm-api
          port: 8080
    - name: web
      backendRefs:
        - name: agent-farm-api
          port: 8080
---
# Forward-auth supplies trusted X-Authentik-Username to the owner-checking gateway and applies only to the web rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: agent-farm-workspaces
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agent-farm-workspaces
      sectionName: web
  extAuth:
    # Forward the session cookie because Envoy Gateway HTTP extAuth omits it by default, causing login redirect loops.
    headersToExtAuth:
      - cookie
    http:
      backendRefs:
        - name: ak-outpost-agent-farm
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - X-Authentik-Username
        # Supplied by an authentik scope mapping on the provider (the value
        # must stay out of this public repo); the ws- gateway rejects
        # browser traffic without the shared proxy token.
        - X-Agent-Farm-Proxy-Token
