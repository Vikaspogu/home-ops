apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-farm-workspaces
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  # No hostnames: catch-all for the https listener. Exact-host routes win per
  # Gateway API precedence, so this only receives ws-<id>.${CLUSTER_DOMAIN}
  # and otherwise-unclaimed hosts. A wildcard hostname is impossible (Gateway
  # API allows only leading-label wildcards) and would poison the UniFi
  # external-dns webhook, which rejects wildcard records.
  rules:
    - backendRefs:
        - name: agent-farm-api
          port: 8080
---
# Forward auth: the outpost checks the workspace session and supplies
# X-Authentik-Username (overriding any client-forged value) before traffic
# reaches the owner-checking gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: agent-farm-workspaces
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agent-farm-workspaces
  extAuth:
    http:
      backendRefs:
        - name: ak-outpost-agent-farm
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      # EG's HTTP extAuth default forwards only Host/Method/Path/Content-Length/
      # Authorization; without the session cookie every check fails and the
      # browser bounces in a login redirect loop.
      headersToExtAuth:
        - cookie
      headersToBackend:
        - X-Authentik-Username
