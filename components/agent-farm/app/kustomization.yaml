apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-farm
resources:
  - externalsecret.yaml
  - rbac.yaml
  - http-route.yaml
  - http-route-workspaces.yaml
  - http-route-auth.yaml
  - datavolumes.yaml
# argocd-image-updater owns the golden-image tag and bumps newTag; the docker:// name matches
# the DataVolume's spec.source.registry/url (see kustomizeconfig.yaml).
images:  
- name: docker://gitea.a113.casa/vpogu/agent-farm-ubuntu
  newTag: 20260903205354-9b722de-oci
configurations:
- kustomizeconfig.yaml
helmCharts:
  - name: app-template
    releaseName: agent-farm
    namespace: agent-farm
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: "5.1.0"
    valuesFile: values.yaml
