apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-farm
resources:
  - externalsecret.yaml
  - rbac.yaml
  - http-route.yaml
  - http-route-workspaces.yaml
  - http-route-auth.yaml
  - datavolumes.yaml
helmCharts:
  - name: app-template
    releaseName: agent-farm
    namespace: agent-farm
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: "5.1.0"
    valuesFile: values.yaml
