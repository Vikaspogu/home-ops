apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-farm-portal
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["portal.agent-farm.${CLUSTER_DOMAIN}"]
  rules:
    - backendRefs:
        - name: ak-outpost-agent-farm
          port: 9000
