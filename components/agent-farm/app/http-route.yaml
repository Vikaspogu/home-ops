apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-farm-portal
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["portal.${CLUSTER_DOMAIN}"]
  rules:
    # Named so the outpost-callback-recovery policy can target just this rule.
    - name: callback
      matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/callback
      backendRefs:
        - name: ak-outpost-agent-farm
          port: 9000
    - backendRefs:
        - name: ak-outpost-agent-farm
          port: 9000
