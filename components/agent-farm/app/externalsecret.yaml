apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-farm-api
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-farm-api-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AGENT_FARM_PROXY_TOKEN: "{{ .AGENT_FARM_PROXY_TOKEN }}"
        DATABASE_URL: >-
          postgres://{{ .AGENT_FARM_POSTGRES_USER }}:{{ .AGENT_FARM_POSTGRES_PASS }}@postgres17-rw.default.svc.cluster.local:5432/agent_farm
        INIT_POSTGRES_DBNAME: agent_farm
        INIT_POSTGRES_HOST: postgres17-rw.default.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .AGENT_FARM_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .AGENT_FARM_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: agent-farm
    - extract:
        key: cloudnative-pg
---
# CDI registry secretRef wants accessKeyId/secretKey keys, not a docker config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-registry-cdi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gitea-registry-cdi
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        accessKeyId: "{{ .username }}"
        secretKey: "{{ .REGISTRY_TOKEN }}"
  dataFrom:
    - extract:
        key: gitea
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-farm-web
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-farm-web-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AGENT_FARM_PROXY_TOKEN: "{{ .AGENT_FARM_PROXY_TOKEN }}"
  dataFrom:
    - extract:
        key: agent-farm
