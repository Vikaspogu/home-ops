apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: t3-orbit
  annotations:
    external-dns.kubernetes.io/target: internal.${CLUSTER_DOMAIN}
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["t3-orbit.${CLUSTER_DOMAIN}"]
  rules:
    - name: app
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Agent-Farm-Proxy-Token
              - X-Authentik-Username
              - X-Authentik-Groups
              - X-Authentik-Email
      backendRefs:
        - name: t3-orbit
          port: 3773
