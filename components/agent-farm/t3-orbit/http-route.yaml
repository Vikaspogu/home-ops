apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: t3-orbit
  annotations:
    external-dns.kubernetes.io/target: internal.${CLUSTER_DOMAIN}
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["t3-orbit.${CLUSTER_DOMAIN}"]
  rules:
    - name: app
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Agent-Farm-Proxy-Token
              - X-Authentik-Username
              - X-Authentik-Groups
              - X-Authentik-Email
      backendRefs:
        - name: t3-orbit
          port: 3773
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: t3-orbit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: t3-orbit
      sectionName: app
  extAuth:
    headersToExtAuth:
      - cookie
    http:
      backendRefs:
        - name: ak-outpost-agent-farm
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
