# Golden workspace base images, imported once by CDI from the immutable
# containerdisk tags published by the agent-farm golden-images workflow.
# Workspace DataVolumes clone these; the tag pin lives in the kustomization
# images: override (owned by argocd-image-updater).
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: agent-farm-ubuntu-base
spec:
  source:
    registry:
      url: docker://gitea.a113.casa/vpogu/agent-farm-ubuntu
      secretRef: gitea-registry-cdi
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: ceph-block
