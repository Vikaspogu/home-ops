# CDI imports immutable golden workspace images once; workspaces clone them and ArgoCD Image Updater owns the kustomization tag pin.
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: agent-farm-ubuntu-base
spec:
  source:
    registry:
      url: docker://gitea.a113.casa/vpogu/agent-farm-ubuntu
      secretRef: gitea-registry-cdi
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: ceph-block
