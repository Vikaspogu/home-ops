# CDI denies spec updates on an existing DataVolume ("Cannot update DataVolume Spec"),
# so a tag bump can never be applied in place. This PreSync hook deletes the golden
# DataVolume right before sync, letting ArgoCD recreate it from the new tag.
# Workspaces keep running: they clone into their own root DataVolumes and never
# reference the golden one after provisioning.
#
# ponytail: always-delete means every sync of this app re-imports the golden image
# (20 GiB from the in-cluster registry, a few minutes). This app only syncs on tag
# bumps, so that is the right trade; compare-and-delete (golden-image-desired
# ConfigMap) if manual syncs become routine.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-image-presync
  namespace: agent-farm
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: golden-image-presync
  namespace: agent-farm
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: golden-image-presync
  namespace: agent-farm
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: golden-image-presync
    namespace: agent-farm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: golden-image-presync
---
apiVersion: batch/v1
kind: Job
metadata:
  name: golden-image-presync
  namespace: agent-farm
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: golden-image-presync
      containers:
        # Distroless: kubectl only, no shell — hence the single imperative command.
        - name: recreate-stale-datavolume
          image: registry.k8s.io/kubectl:v1.31.4
          command: ["/ko-app/kubectl"]
          args:
            - -n
            - agent-farm
            - delete
            - datavolume
            - agent-farm-ubuntu-base
            - --ignore-not-found
