fullnameOverride: &name gitea
controllers:
  gitea:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
        envFrom: &envFrom
          - secretRef:
              name: gitea-secret
    containers:
      gitea:
        image:
          repository: ghcr.io/go-gitea/gitea
          tag: 1.27.3-rootless
        env:
          TZ: "America/New_York"
          USER_UID: 1000
          USER_GID: 1000
          GITEA__ACTIONS__ENABLED: "true"
          GITEA__ACTIONS__DEFAULT_ACTIONS_URL: "https://gitea.com"
          GITEA__PACKAGES__ENABLED: "true"
          # Keep native package-retention rules disabled because the custom CronJob owns retention; native cleanup still collects unreferenced blobs.
          GITEA__cron.cleanup_packages__ENABLED: "true"
          GITEA__cron.cleanup_packages__RUN_AT_START: "true"
          GITEA__cron.cleanup_packages__SCHEDULE: "@midnight"
          GITEA__cron.cleanup_packages__OLDER_THAN: "24h"
          GITEA__database__DB_TYPE: "postgres"
          # Fsync Git objects before moving refs to prevent another interruption-related repository truncation.
          GITEA__git.config__core.fsync: "objects"
          GITEA__REPOSITORY__ENABLE_PUSH_CREATE_USER: "True"
          GITEA__REPOSITORY__DEFAULT_BRANCH: "main"
          GITEA__SECURITY__INSTALL_LOCK: "True"
          GITEA__SERVER__DOMAIN: "gitea.${CLUSTER_DOMAIN}"
          GITEA__SERVER__ROOT_URL: "https://gitea.${CLUSTER_DOMAIN}"
          GITEA__SERVER__SSH_DOMAIN: "ssh.${CLUSTER_DOMAIN}"
          GITEA__SERVER__SSH_PORT: 2222
        securityContext:
          allowPrivilegeEscalation: false
          # mkdir: can't create directory '/tmp/gitea': Read-only file system
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        envFrom: *envFrom
        resources:
          requests:
            cpu: 10m
            memory: 500Mi
          limits:
            memory: 2Gi
service:
  gitea:
    controller: *name
    ports:
      http:
        port: 3000
  ssh:
    enabled: true
    # Expose Gitea SSH for the DGX coding bot via Klipper svclb on 2222 because host OpenSSH owns port 22.
    type: LoadBalancer
    controller: *name
    ports:
      ssh:
        enabled: true
        port: 2222
        targetPort: 2222
        protocol: TCP

persistence:
  config:
    enabled: true
    existingClaim: gitea
    globalMounts:
      - path: /var/lib/gitea
