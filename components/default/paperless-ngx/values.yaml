---
controllers:
  app:
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
        envFrom: &envFrom
          - secretRef:
              name: paperless-ngx-secret
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/paperless-ngx/paperless-ngx
          tag: 3.0.5
        env:
          PAPERLESS_URL: "https://paperless.${CLUSTER_DOMAIN}"
          PAPERLESS_REDIS: "redis://valkey.default.svc.cluster.local:6379/5"
          PAPERLESS_OCR_LANGUAGE: eng
          PAPERLESS_TIME_ZONE: America/New_York
          PAPERLESS_CONSUMER_POLLING: "60"
          PAPERLESS_CONSUMER_RECURSIVE: "true"
          PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
          PAPERLESS_TASK_WORKERS: "2"
          PAPERLESS_TIKA_ENABLED: "0"
          PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
          PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: https
          PAPERLESS_DISABLE_REGULAR_LOGIN: "false"
          PAPERLESS_FILENAME_FORMAT: "{created_year}/{correspondent}/{title}"
          USERMAP_UID: "0"
          USERMAP_GID: "0"
        envFrom: *envFrom
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 30
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi

service:
  app:
    ports:
      http:
        port: &port 8000

persistence:
  data:
    existingClaim: paperless-ngx
    advancedMounts:
      app:
        app:
          - path: /usr/src/paperless/data
  media:
    enabled: true
    type: nfs
    server: synology.a113.internal
    path: "/volume1/media/k8s-data/paperless"
    globalMounts:
      - path: /usr/src/paperless/media
  consume:
    enabled: true
    type: nfs
    server: synology.a113.internal
    path: "/volume1/homes/vikaspogu/Documents"
    globalMounts:
      - path: /usr/src/paperless/consume
