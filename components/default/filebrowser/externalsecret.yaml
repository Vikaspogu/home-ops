---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: filebrowser-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # FILEBROWSER_JWT_TOKEN_SECRET is deliberately not set: v2 keeps the signing key in the SQLite DB and refuses to start if a configured env key differs from the persisted one.
        FILEBROWSER_ADMIN_PASSWORD: "{{ .FILEBROWSER_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: filebrowser
