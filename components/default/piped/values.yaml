---
defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
controllers:
  backend:
    strategy: RollingUpdate
    annotations:
      secret.reloader.stakater.com/reload: piped-secret, piped-db-creds
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 19.0.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
        envFrom: &envFrom
          - secretRef:
              name: piped-db-creds
    containers:
      app:
        image:
          repository: 1337kavin/piped
          tag: latest@sha256:7747e19ee501c0a3afa94dd3d6e982dd4247f1babe03fb515b4a0f0b87f82b2e
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 500Mi
          limits:
            memory: 2000Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
  frontend:
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: ghcr.io/bjw-s-labs/piped-frontend
          tag: 2025.3.17@sha256:8ed05c7df0bc8899e54a3952a99b63d55cdc7669d759beeb9370fbb32330468b
        env:
          BACKEND_HOSTNAME: papi.${CLUSTER_DOMAIN}
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
  ytproxy:
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: 1337kavin/piped-proxy
          tag: latest@sha256:a9496366e7f2f4e99d6608fa8e442f2e72628bc7bbeae09273d41caaf562a915
        command:
          - /app/piped-proxy
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 500Mi
          limits:
            memory: 2000Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

service:
  backend:
    controller: backend
    ports:
      http:
        port: &port 8080
  frontend:
    controller: frontend
    ports:
      http:
        port: 8080
  ytproxy:
    controller: ytproxy
    ports:
      http:
        port: 8080

persistence:
  config:
    type: secret
    name: piped-secret
    advancedMounts:
      backend:
        app:
          - path: /app/config.properties
            subPath: config.properties
            readOnly: true
