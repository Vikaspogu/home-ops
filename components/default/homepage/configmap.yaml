---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  settings.yaml: |
    title: Home Ops
    description: Applications, infrastructure, and media at home.
    theme: dark
    color: slate
    headerStyle: clean
    cardStyle: hairline
    fullWidth: true
    useEqualHeights: true
    statusStyle: basic
    target: _blank
    quicklaunch:
      searchDescriptions: true
      mobileButtonPosition: bottom-right
    # Keep Ingress first for mobile; desktop CSS places the first two groups in columns 2 and 1.
    layout:
      Ingress:
        style: row
        columns: 2
      Observability:
        style: row
        columns: 1
      Media:
        style: row
        columns: 1
      Git:
        style: row
        columns: 2
  bookmarks.yaml: |
    - Git:
        - kubesearch:
            - icon: kubernetes-dashboard.png
              href: https://kubesearch.dev
        - flux-cluster-template:
            - icon: github.png
              href: https://github.com/onedr0p/flux-cluster-template
  services.yaml: |
    - Observability:
        - Unifi:
            href: https://{{HOMEPAGE_VAR_UNIFI_IP}}
            icon: unifi.png
            description: Network management
            widget:
              type: unifi
              url: https://{{HOMEPAGE_VAR_UNIFI_IP}}
              username: {{HOMEPAGE_VAR_UNIFI_USER}}
              password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
        - Cloudflared:
            href: https://dash.cloudflare.com
            icon: cloudflare-zero-trust.png
            description: Cloudflare tunnel
            widget:
              type: cloudflared
              accountid: "{{HOMEPAGE_VAR_CLOUDFLARED_ACCOUNTID}}"
              tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARED_TUNNELID}}"
              key: "{{HOMEPAGE_VAR_CLOUDFLARED_API_TOKEN}}"
        - NAS:
            href: https://nas.{{HOMEPAGE_VAR_DOMAIN_NAME}}
            icon: synology-dsm.png
            description: Network storage
            widget:
              type: diskstation
              url: {{HOMEPAGE_VAR_NAS_IP}}
              username: {{HOMEPAGE_VAR_DSM_USER}}
              password: {{HOMEPAGE_VAR_DSM_PASSWORD}}
        - Kopia:
            href: https://kopia.{{HOMEPAGE_VAR_DOMAIN_NAME}}
            icon: kopia.png
            description: Backup snapshots
            widget:
              type: kopia
              url: http://kopia.volsync-system.svc.cluster.local:80
        - Scrutiny:
            href: https://scrutiny.{{HOMEPAGE_VAR_DOMAIN_NAME}}
            icon: scrutiny.png
            description: Disk health
            widget:
              type: scrutiny
              url: http://scrutiny.observability.svc.cluster.local:8080
    - Media:
      - qBittorrent:
          href: https://qb.${CLUSTER_DOMAIN}
          icon: qbittorrent.png
          description: Torrents
          widget:
            type: qbittorrent
            url: http://qbittorrent.downloads.svc.cluster.local:8080
            username: {{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}
            password: {{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}
      - Sabnzbd:
          href: https://sabnzbd.${CLUSTER_DOMAIN}
          icon: sabnzbd.png
          description: Usenet downloads
          widget:
            type: sabnzbd
            url: http://sabnzbd.downloads.svc.cluster.local
            key: {{HOMEPAGE_VAR_SABNZBD_API_KEY}}
      - Radarr:
          href: https://radarr.${CLUSTER_DOMAIN}
          icon: radarr.png
          description: Movie library
          widget:
            type: radarr
            url: http://radarr.default.svc.cluster.local
            key: {{HOMEPAGE_VAR_RADARR_API_KEY}}
      - Sonarr:
          href: https://sonarr.${CLUSTER_DOMAIN}
          icon: sonarr.png
          description: TV library
          widget:
            type: sonarr
            url: http://sonarr.default.svc.cluster.local
            key: {{HOMEPAGE_VAR_SONARR_API_KEY}}
  widgets.yaml: |
    - greeting:
        text_size: 2xl
        text: Home Ops
    - resources:
        backend: kubernetes
        cpu: true
        expanded: true
        memory: true
    - search:
        provider: ["duckduckgo"]
        focus: false
        target: _blank
    - datetime:
        text_size: sm
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - openmeteo:
        label: Home
        latitude: {{HOMEPAGE_VAR_LATITUDE}}
        longitude: {{HOMEPAGE_VAR_LONGITUDE}}
        units: metric
        cache: 5
    - unifi_console:
        url: https://{{HOMEPAGE_VAR_UNIFI_IP}}
        username: {{HOMEPAGE_VAR_UNIFI_USER}}
        password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
  docker.yaml: ""
  # THESIS: A quiet control surface keeps applications and real service status together.
  # OWN-WORLD: Near-black surfaces, rounded cards, inset icon tiles, Figtree, and cyan keyboard focus.
  # STORY: Find an application, check its status, then open the destination.
  # FIRST VIEWPORT: Identity and search above three columns for infrastructure, applications, and media.
  # FORM: User-pinned home dashboard reference supersedes O1 (seed 9e964f1f), using native Homepage links and widgets.
  custom.css: |
    @import url("https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap");

    :root {
      --home-bg: #101216;
      --home-surface: #171a22;
      --home-hover: #202633;
      --home-border: #303642;
      --home-text: #edf0f6;
      --home-muted: #adb7c8;
      --home-accent: #39bdf1;
      --home-icon: #242b37;
      --home-radius: 20px;
    }

    html:root, html body, html #__next, #page_wrapper {
      background-color: var(--home-bg);
      color: var(--home-text);
      font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #inner_wrapper > div {
      max-width: 1600px;
    }

    #information-widgets, #layout-groups, #services, #bookmarks {
      margin: 0 32px;
      padding: 0;
    }

    #information-widgets {
      padding-top: 32px;
      margin-bottom: 32px;
      border: 0;
    }

    #widgets-wrap {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
      align-items: center;
    }

    #information-widgets-right {
      display: contents;
    }

    #widgets-wrap .widget-container {
      grid-column: span 6;
      order: 2;
      min-width: 0;
      margin: 0;
    }

    #widgets-wrap > .widget-container:not(.information-widget-greeting) {
      background: var(--home-surface);
      border: 1px solid var(--home-border);
      border-radius: var(--home-radius);
      padding: 14px 16px;
      align-self: stretch;
      justify-content: center;
    }

    #widgets-wrap .information-widget-greeting {
      order: 0;
      grid-column: span 6;
    }

    .information-widget-greeting span {
      color: var(--home-text);
      font-size: 1.75rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    #widgets-wrap .information-widget-datetime,
    #widgets-wrap .information-widget-openmeteo,
    #widgets-wrap .information-widget-openmeteo-location-button {
      order: 0;
      grid-column: span 3;
      min-width: 0;
    }

    .information-widget-datetime span {
      color: var(--home-muted);
      font-size: 0.8125rem;
      overflow-wrap: anywhere;
    }

    #widgets-wrap .information-widget-search {
      order: 1;
      grid-column: 1 / -1;
      margin: 0;
      min-width: 0;
    }

    .information-widget-search > div {
      margin: 0;
      height: auto;
      min-width: 0;
    }

    .information-widget-search input {
      min-height: 48px;
      background: var(--home-surface);
      color: var(--home-text);
      border: 1px solid var(--home-border);
      border-radius: var(--home-radius);
      font-size: 0.875rem;
      box-shadow: none;
    }

    .information-widget-search input::placeholder {
      color: var(--home-muted);
      opacity: 1;
    }

    #layout-groups, #services, #bookmarks {
      gap: 28px;
    }

    .services-group, .bookmark-group {
      min-width: 0;
      padding: 0;
    }

    .service-group-name, .bookmark-group-name {
      color: var(--home-text);
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .services-group > button, .bookmark-group > button {
      gap: 12px;
      min-height: 44px;
    }

    .services-list, .bookmarks-list {
      column-gap: 12px;
      row-gap: 4px;
    }

    .service, .bookmark {
      min-width: 0;
    }

    .service-card, .bookmark > a {
      background: var(--home-surface);
      border: 1px solid var(--home-border);
      border-radius: var(--home-radius);
      box-shadow: none;
      color: var(--home-text);
      transition: background-color 160ms ease-out, border-color 160ms ease-out;
    }

    .service-card {
      padding: 12px;
    }

    .service-card:hover, .bookmark > a:hover {
      background: var(--home-hover);
      border-color: var(--home-muted);
      color: var(--home-text);
    }

    .service-title {
      min-height: 60px;
      align-items: center;
    }

    .service-title-text, .service-name {
      min-width: 0;
    }

    .service-name {
      color: var(--home-text);
      font-size: 0.875rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .service-description, .bookmark-description {
      margin-top: 3px;
      color: var(--home-muted);
      font-size: 0.75rem;
      font-weight: 400;
    }

    .service-icon {
      width: 48px;
      height: 48px;
      margin-right: 8px;
      border-radius: 14px;
      background: var(--home-icon);
    }

    .service-icon > img, .service-icon > div {
      max-width: 28px;
      max-height: 28px;
    }

    .service-tags {
      position: static;
      flex-shrink: 0;
      margin: 0 2px 0 4px;
    }

    .service-container {
      border-top: 1px solid var(--home-border);
      margin-top: 6px;
      padding-top: 8px;
      flex-wrap: wrap;
    }

    .service-block:not([data-highlight-level]) {
      background: transparent;
    }

    .service-block {
      min-width: 0;
    }

    .service-block-value {
      font-size: 1.125rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .service-block-label {
      color: var(--home-muted);
      font-size: 0.6875rem;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      opacity: 1;
      overflow-wrap: anywhere;
    }

    .bookmark > a {
      padding: 8px;
      min-height: 56px;
    }

    .bookmark-icon {
      width: 40px;
      margin-right: 4px;
      border-radius: 12px;
      background: var(--home-icon);
    }

    .bookmark-name {
      color: var(--home-text);
      font-size: 0.8125rem;
      font-weight: 500;
    }

    .k8s-status {
      border: 1px solid var(--home-border);
      border-radius: 6px;
      background: transparent;
    }

    .k8s-status > div {
      font-size: 0.625rem;
      letter-spacing: 0.04em;
    }

    .service-card summary {
      color: var(--home-text);
    }

    #page_wrapper :is(a, button, input, summary):focus-visible {
      outline: 2px solid var(--home-accent);
      outline-offset: -2px;
    }

    #footer {
      padding: 24px 32px;
    }

    @media (min-width: 1280px) {
      #layout-groups {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr) minmax(0, 1fr);
        align-items: start;
      }

      #layout-groups > .bookmark-group {
        grid-column: 1 / -1;
      }

      #layout-groups > .services-group:first-child {
        grid-column: 2;
        grid-row: 1;
      }

      #layout-groups > .services-group:nth-child(2) {
        grid-column: 1;
        grid-row: 1;
      }
    }

    @media (max-width: 767px) {
      #information-widgets, #layout-groups, #services, #bookmarks {
        margin-left: 16px;
        margin-right: 16px;
      }

      #information-widgets {
        padding-top: 24px;
        margin-bottom: 24px;
      }

      #widgets-wrap {
        gap: 12px;
      }

      #widgets-wrap .information-widget-greeting {
        grid-column: 1 / -1;
      }

      #widgets-wrap .widget-container,
      #widgets-wrap .information-widget-search {
        grid-column: 1 / -1;
      }

      #widgets-wrap .information-widget-datetime,
      #widgets-wrap .information-widget-openmeteo,
      #widgets-wrap .information-widget-openmeteo-location-button {
        grid-column: span 6;
      }

      .information-widget-datetime span {
        text-align: left;
      }

      .bookmark-text {
        flex-wrap: wrap;
      }

      .bookmark-description {
        width: 100%;
        padding-left: 12px;
        padding-top: 0;
      }

      #footer {
        padding: 24px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #page_wrapper *, #page_wrapper *::before, #page_wrapper *::after {
        animation: none;
        transition: none;
      }
    }
