---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  settings.yaml: |
    title: Home Ops
    description: Applications, infrastructure, and media at home.
    theme: dark
    color: slate
    headerStyle: clean
    cardStyle: hairline
    fullWidth: true
    useEqualHeights: true
    statusStyle: basic
    target: _blank
    quicklaunch:
      searchDescriptions: true
      mobileButtonPosition: bottom-right
    # Keep Ingress first for mobile; desktop CSS places the first two groups in columns 2 and 1.
    layout:
      Ingress:
        style: row
        columns: 2
      Observability:
        style: row
        columns: 1
      Media:
        style: row
        columns: 1
      Git:
        style: row
        columns: 2
  bookmarks.yaml: |
    - Git:
        - kubesearch:
            - icon: kubernetes-dashboard.png
              href: https://kubesearch.dev
        - flux-cluster-template:
            - icon: github.png
              href: https://github.com/onedr0p/flux-cluster-template
  services.yaml: |
    - Observability:
        - Unifi:
            href: https://{{HOMEPAGE_VAR_UNIFI_IP}}
            icon: unifi.png
            description: Network management
            widget:
              type: unifi
              url: https://{{HOMEPAGE_VAR_UNIFI_IP}}
              username: {{HOMEPAGE_VAR_UNIFI_USER}}
              password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
        - Cloudflared:
            href: https://dash.cloudflare.com
            icon: cloudflare-zero-trust.png
            description: Cloudflare tunnel
            widget:
              type: cloudflared
              accountid: "{{HOMEPAGE_VAR_CLOUDFLARED_ACCOUNTID}}"
              tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARED_TUNNELID}}"
              key: "{{HOMEPAGE_VAR_CLOUDFLARED_API_TOKEN}}"
        - NAS:
            href: https://nas.{{HOMEPAGE_VAR_DOMAIN_NAME}}
            icon: synology-dsm.png
            description: Network storage
            widget:
              type: diskstation
              url: {{HOMEPAGE_VAR_NAS_IP}}
              username: {{HOMEPAGE_VAR_DSM_USER}}
              password: {{HOMEPAGE_VAR_DSM_PASSWORD}}
        - Kopia:
            href: https://kopia.{{HOMEPAGE_VAR_DOMAIN_NAME}}
            icon: kopia.png
            description: Backup snapshots
            widget:
              type: kopia
              url: http://kopia.volsync-system.svc.cluster.local:80
        - Scrutiny:
            href: https://scrutiny.{{HOMEPAGE_VAR_DOMAIN_NAME}}
            icon: scrutiny.png
            description: Disk health
            widget:
              type: scrutiny
              url: http://scrutiny.observability.svc.cluster.local:8080
    - Media:
      - qBittorrent:
          href: https://qb.${CLUSTER_DOMAIN}
          icon: qbittorrent.png
          description: Torrents
          widget:
            type: qbittorrent
            url: http://qbittorrent.downloads.svc.cluster.local:8080
            username: {{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}
            password: {{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}
      - Sabnzbd:
          href: https://sabnzbd.${CLUSTER_DOMAIN}
          icon: sabnzbd.png
          description: Usenet downloads
          widget:
            type: sabnzbd
            url: http://sabnzbd.downloads.svc.cluster.local
            key: {{HOMEPAGE_VAR_SABNZBD_API_KEY}}
      - Radarr:
          href: https://radarr.${CLUSTER_DOMAIN}
          icon: radarr.png
          description: Movie library
          widget:
            type: radarr
            url: http://radarr.default.svc.cluster.local
            key: {{HOMEPAGE_VAR_RADARR_API_KEY}}
      - Sonarr:
          href: https://sonarr.${CLUSTER_DOMAIN}
          icon: sonarr.png
          description: TV library
          widget:
            type: sonarr
            url: http://sonarr.default.svc.cluster.local
            key: {{HOMEPAGE_VAR_SONARR_API_KEY}}
  widgets.yaml: |
    - greeting:
        text_size: 2xl
        text: Home Ops
    - resources:
        backend: kubernetes
        cpu: true
        expanded: true
        memory: true
    - search:
        provider: ["duckduckgo"]
        focus: false
        target: _blank
    - datetime:
        text_size: sm
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - openmeteo:
        label: Home
        latitude: {{HOMEPAGE_VAR_LATITUDE}}
        longitude: {{HOMEPAGE_VAR_LONGITUDE}}
        units: metric
        cache: 5
    - unifi_console:
        url: https://{{HOMEPAGE_VAR_UNIFI_IP}}
        username: {{HOMEPAGE_VAR_UNIFI_USER}}
        password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
  docker.yaml: ""
  # THESIS: Quiet Precision makes launch targets tactile and real status immediately legible.
  # OWN-WORLD: Obsidian gradients, inset highlights, Figtree labels, JetBrains Mono telemetry, and semantic state tints.
  # STORY: Find an application, check its status, then open the destination.
  # FIRST VIEWPORT: Compact identity and telemetry above search, two-up mobile launch tiles, and three balanced desktop sections.
  # FORM: User-pinned Quiet Precision / Dark Obsidian specification, adapted to native Homepage capabilities.
  custom.css: |
    @import url("https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap");

    :root {
      --home-bg: #0b0e14;
      --home-surface: linear-gradient(180deg, rgba(24, 29, 40, 0.88), rgba(16, 20, 28, 0.92));
      --home-hover: #1c2330;
      --home-border: rgba(255, 255, 255, 0.06);
      --home-text: #f8fafc;
      --home-muted: #94a3b8;
      --home-accent: #38bdf8;
      --home-icon: rgba(148, 163, 184, 0.10);
      --home-radius: 18px;
      --home-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    html:root, html body, html #__next, #page_wrapper {
      background-color: var(--home-bg);
      color: var(--home-text);
      font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    #inner_wrapper > div {
      max-width: 1600px;
    }

    #information-widgets, #layout-groups, #services, #bookmarks {
      margin: 0 32px;
      padding: 0;
    }

    #information-widgets {
      padding-top: 32px;
      margin-bottom: 24px;
      border: 0;
    }

    #widgets-wrap {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 10px;
      align-items: center;
    }

    #information-widgets-right {
      display: contents;
    }

    #widgets-wrap .widget-container {
      grid-column: span 6;
      order: 2;
      min-width: 0;
      margin: 0;
    }

    #widgets-wrap > .widget-container:not(.information-widget-greeting) {
      background: var(--home-surface);
      border: 1px solid var(--home-border);
      border-radius: var(--home-radius);
      padding: 14px 16px;
      align-self: stretch;
      justify-content: center;
    }

    #widgets-wrap .information-widget-greeting {
      order: 0;
      grid-column: span 6;
    }

    .information-widget-greeting span {
      color: var(--home-text);
      font-size: 1.625rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    #widgets-wrap .information-widget-datetime,
    #widgets-wrap .information-widget-openmeteo,
    #widgets-wrap .information-widget-openmeteo-location-button {
      order: 0;
      grid-column: span 3;
      min-width: 0;
    }

    .information-widget-datetime span {
      color: var(--home-muted);
      font-size: 0.8125rem;
      overflow-wrap: anywhere;
    }

    #widgets-wrap .information-widget-search {
      order: 1;
      grid-column: 1 / -1;
      margin: 0;
      min-width: 0;
    }

    .information-widget-search > div {
      margin: 0;
      height: auto;
      min-width: 0;
    }

    .information-widget-search input {
      min-height: 48px;
      background: var(--home-surface);
      color: var(--home-text);
      border: 1px solid var(--home-border);
      border-radius: var(--home-radius);
      font-size: 0.875rem;
      box-shadow: none;
    }

    .information-widget-search input::placeholder {
      color: var(--home-muted);
      opacity: 1;
    }

    #layout-groups, #services, #bookmarks {
      gap: 20px;
    }

    .services-group, .bookmark-group {
      min-width: 0;
      padding: 0;
    }

    .service-group-name, .bookmark-group-name {
      color: #94a3b8;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.10em;
    }

    .services-group > button, .bookmark-group > button {
      gap: 12px;
      min-height: 44px;
    }

    .services-list, .bookmarks-list {
      column-gap: 10px;
      row-gap: 10px;
    }

    .service, .bookmark {
      min-width: 0;
    }

    .service-card, .bookmark > a {
      background: var(--home-surface);
      border: 1px solid var(--home-border);
      border-radius: var(--home-radius);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      color: var(--home-text);
      transition: background-color 160ms ease-out, border-color 160ms ease-out, filter 160ms ease-out;
    }

    .service-card {
      padding: 12px 14px;
      margin-bottom: 0;
      height: 100%;
    }

    .service-card:hover, .bookmark > a:hover {
      filter: brightness(1.12);
      background: var(--home-hover);
      border-color: var(--home-muted);
      color: var(--home-text);
    }

    .service-title {
      min-height: 42px;
      align-items: center;
    }

    .service-title-text, .service-name {
      min-width: 0;
    }

    .service-name {
      color: var(--home-text);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .service-description, .bookmark-description {
      margin-top: 3px;
      color: var(--home-muted);
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .service-icon {
      width: 38px;
      height: 38px;
      margin-right: 8px;
      border-radius: 12px;
      background: var(--home-icon);
    }

    .service-icon > img, .service-icon > div {
      max-width: 24px;
      max-height: 24px;
    }

    .service-tags {
      position: static;
      flex-shrink: 0;
      margin: 0 2px 0 4px;
    }

    .service-container {
      border-top: 1px solid var(--home-border);
      margin-top: 6px;
      padding-top: 8px;
      flex-wrap: wrap;
    }

    .service-block:not([data-highlight-level]) {
      background: transparent;
    }

    .service-block {
      min-width: 0;
    }

    .service-block-value {
      font-size: 1.125rem;
      font-weight: 600;
      font-family: var(--home-mono);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .service-block-label {
      color: var(--home-muted);
      font-size: 0.6875rem;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      opacity: 1;
      overflow-wrap: anywhere;
    }

    .bookmark > a {
      padding: 8px;
      min-height: 56px;
    }

    .bookmark-icon {
      width: 40px;
      margin-right: 4px;
      border-radius: 12px;
      background: var(--home-icon);
    }

    .bookmark-name {
      color: var(--home-text);
      font-size: 0.8125rem;
      font-weight: 500;
    }

    .k8s-status {
      border: 1px solid var(--home-border);
      border-radius: 999px;
      background: transparent;
    }

    .k8s-status > div {
      font-size: 0.625rem;
      font-family: var(--home-mono);
      font-weight: 600;
      letter-spacing: 0;
    }

    .service-card summary {
      color: var(--home-text);
    }

    #page_wrapper :is(a, button, input, summary):focus-visible {
      outline: 2px solid var(--home-accent);
      outline-offset: -2px;
    }

    #footer {
      padding: 24px 32px;
    }

    @media (min-width: 1144px) {
      #layout-groups {
        display: grid;
        grid-template-columns: repeat(3, minmax(340px, 1fr));
        align-items: start;
      }

      #layout-groups > .services-group .services-list {
        grid-template-columns: minmax(0, 1fr);
      }

      #layout-groups > .bookmark-group {
        grid-column: 1 / -1;
      }

      #layout-groups > .services-group:first-child {
        grid-column: 2;
        grid-row: 1;
      }

      #layout-groups > .services-group:nth-child(2) {
        grid-column: 1;
        grid-row: 1;
      }
    }

    @media (max-width: 767px) {
      #information-widgets, #layout-groups, #services, #bookmarks {
        margin-left: 16px;
        margin-right: 16px;
      }

      #information-widgets {
        padding-top: 18px;
        margin-bottom: 24px;
      }

      #widgets-wrap {
        gap: 12px;
      }

      #widgets-wrap .information-widget-greeting {
        grid-column: 1 / -1;
      }

      #widgets-wrap .widget-container,
      #widgets-wrap .information-widget-search {
        grid-column: 1 / -1;
      }

      #widgets-wrap .information-widget-datetime,
      #widgets-wrap .information-widget-openmeteo,
      #widgets-wrap .information-widget-openmeteo-location-button {
        grid-column: span 6;
      }

      .information-widget-datetime span {
        text-align: left;
      }

      .bookmark-text {
        flex-wrap: wrap;
      }

      .bookmark-description {
        width: 100%;
        padding-left: 12px;
        padding-top: 0;
      }

      #footer {
        padding: 24px 16px;
      }
    }


    .information-widget-datetime, .information-widget-openmeteo,
    .information-widget-resources, .information-widget-unifi_console,
    .service-block-value, .k8s-status {
      font-family: var(--home-mono);
      font-variant-numeric: tabular-nums;
    }

    .service-title-text {
      min-height: 42px;
    }

    .service-name {
      padding: 0;
    }

    .service:has(.k8s-status) .service-title {
      position: relative;
    }

    .service:has(.k8s-status) .service-title-text {
      padding-bottom: 20px;
    }

    .service:has(.k8s-status) .service-description {
      display: none;
    }

    .service:has(.k8s-status) .service-tags {
      position: absolute;
      top: 18px;
      bottom: auto;
      left: 46px;
      right: 0;
      margin: 0;
      justify-content: flex-start;
      pointer-events: none;
    }

    .service-app {
      min-width: 44px;
      min-height: 26px;
      pointer-events: auto;
    }

    .service-block[data-highlight-level="warn"] {
      background: rgba(245, 158, 11, 0.20);
      color: #fbbf24;
    }

    .service-block[data-highlight-level="danger"] {
      background: rgba(244, 63, 94, 0.20);
      color: #fb7185;
    }

    .service-block[data-highlight-level="good"] {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
    }

    .service-block[data-highlight-level] .service-block-label {
      color: inherit;
    }

    .service-card:has(.k8s-status[title="running"]) {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.14), rgba(16, 20, 28, 0.92));
      border-color: rgba(52, 211, 153, 0.30);
    }

    .service-card:has(.k8s-status[title="running"]) .service-icon {
      background: rgba(16, 185, 129, 0.18);
    }

    .k8s-status[title="running"] > div {
      color: #34d399;
    }

    .service-card:has(.k8s-status:is([title="down"], [title="not found"], [title="partial"], [title="error" i])) {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.16), rgba(16, 20, 28, 0.92));
      border-color: rgba(251, 113, 133, 0.36);
    }

    .service-card:has(.k8s-status:is([title="down"], [title="not found"], [title="partial"], [title="error" i])) .service-icon {
      background: rgba(244, 63, 94, 0.20);
    }

    .k8s-status:is([title="down"], [title="not found"], [title="partial"], [title="error" i]) > div {
      color: #fb7185;
    }

    #widgets-wrap > .information-widget-resources {
      border-radius: 22px;
      padding: 18px 20px;
    }

    #widgets-wrap .information-widget-search input {
      background: var(--home-surface);
    }

    @media (max-width: 1143px) {
      .services-group:first-child .services-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 639px) {
      #inner_wrapper {
        padding-bottom: calc(110px + env(safe-area-inset-bottom));
      }

      #page_wrapper button.fixed.bottom-4 {
        left: 50%;
        right: auto;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: 180px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 22px;
        background: rgba(15, 19, 28, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        color: var(--home-text);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      }

      #page_wrapper button.fixed.bottom-4::after {
        content: "Quick Launch";
        font-size: 14px;
        font-weight: 700;
      }
    }

    @media (max-width: 359px) {
      .services-group:first-child .services-list {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #page_wrapper *, #page_wrapper *::before, #page_wrapper *::after {
        animation: none;
        transition: none;
      }
    }
