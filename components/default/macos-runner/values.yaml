---
# macOS build runner for Gitea Actions (desktop DMG + iOS-adjacent builds).
# Runs dockurr/macos: macOS as a KVM guest inside a privileged container.
# The image downloads the macOS recovery from Apple and installs unattended
# on first boot; the disk persists on the PVC. KubeVirt is deliberately NOT
# used: macOS guests need raw qemu args (AppleSMC, custom OVMF) that
# KubeVirt's libvirt layer cannot express. See README.md for bootstrap.
defaultPodOptions:
  nodeSelector:
    # Only node with KVM exposed (devices.kubevirt.io/kvm > 0).
    kubernetes.io/hostname: k8s-5-1u

controllers:
  app:
    replicas: 1
    strategy: Recreate
    containers:
      app:
        image:
          repository: dockurr/macos
          tag: "3.12"
        env:
          # macOS 13 Ventura: newest version that boots on k8s-5-1u's Xeon
          # E5-2658 (Sandy Bridge, no AVX2). 14+ spins at XNU handoff.
          VERSION: "13"
          RAM_SIZE: 16G
          CPU_CORES: "8"
          DISK_SIZE: 180G
        securityContext:
          # KVM-in-container needs privilege; node isolation is the boundary,
          # same tradeoff as gitea-runner's dind sidecar.
          privileged: true
        resources:
          requests:
            cpu: 500m
            memory: 18Gi
          limits:
            memory: 20Gi

service:
  app:
    controller: app
    ports:
      # Web viewer: browser-based console for setup and debugging.
      viewer:
        port: 8006
      # Native VNC, same console.
      vnc:
        port: 5900

persistence:
  storage:
    enabled: true
    existingClaim: macos-runner
    globalMounts:
      - path: /storage
