---
controllers:
  app:
    type: cronjob
    cronjob:
      schedule: "0 3 * * *"
      timeZone: America/New_York
      concurrencyPolicy: Forbid
      successfulJobsHistory: 3
      failedJobsHistory: 3
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      restartPolicy: Never
    containers:
      app:
        image:
          repository: ghcr.io/renovatebot/renovate
          tag: "44.180.0@sha256:ad97d11f73542932f3615dcfd8bc9637d20f80ebf6cc97d0d12a885a19bf3412"
        env:
          RENOVATE_CONFIG_FILE: /config/config.js
          LOG_LEVEL: info
          NODE_OPTIONS: "--max-old-space-size=3072"
        envFrom:
          - secretRef:
              name: renovate-secret
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          # readOnlyRootFilesystem must stay false until containerbase#7424 is fixed: its CLI writes /opt/containerbase/data/links.nedb when installing/linking tools, so a RO rootfs breaks npm/python tool setup (spawn npm ENOENT) - https://github.com/containerbase/base/issues/7424
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false

persistence:
  config:
    enabled: true
    type: configMap
    name: renovate-config
    globalMounts:
      - path: /config
        readOnly: true
  cache:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /tmp/renovate
  tmp:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /tmp
