# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app daybook
  labels:
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
  annotations:
    gethomepage.dev/href: "https://daybook.${CLUSTER_DOMAIN}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Ingress
    gethomepage.dev/name: daybook
    gethomepage.dev/description: "Cross-runtime agent work journal"
    gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/google-keep.png
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["daybook.${CLUSTER_DOMAIN}"]
  rules:
    - backendRefs:
        - name: daybook
          namespace: ai
          port: 31457
