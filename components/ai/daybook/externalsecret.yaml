---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: daybook
spec:
    secretStoreRef:
        kind: ClusterSecretStore
        name: onepassword-connect
    target:
        name: daybook-secret
        template:
            engineVersion: v2
            data:
                # dbk_ push token shared with workspace VMs (their push.token).
                # The init container upserts it into the ledger by label, so
                # VMs and the web UI can authenticate.
                DAYBOOK_PUSH_TOKEN: "{{ .DAYBOOK_PUSH_TOKEN }}"
                # Insights page AI card: shared NVIDIA inference hub (same as sre-agent / hermes-agent).
                DAYBOOK_INSIGHTS_BASE_URL: "{{ .INFERENCE_HUB_BASE_URL }}"
                DAYBOOK_INSIGHTS_API_KEY: "{{ .INFERENCE_HUB_CODING_KEY }}"
    dataFrom:
        - extract:
              key: daybook
        - extract:
              key: inference-hub
