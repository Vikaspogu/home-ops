---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
data:
  config.yaml: |-
    model:
      default: gpt-6-sol
      provider: openai-codex
      # Clear the old custom route retained by the PVC merge.
      api_key: ""
      base_url: ""
    cron:
      # Follow model.default instead of pinning cron inference separately.
      model_drift_guard: false
    approvals:
      mode: manual
    providers:
      # The PVC merge keeps removed keys, so null disables the old Spark endpoint.
      spark: null
      inference-hub:
        base_url: "${HERMES_BASE_URL}"
        key_env: HERMES_API_KEY
        api_mode: chat_completions
    image_gen:
      provider: openai-codex
      model: gpt-image-2
      timeout: 180
    auxiliary:
      vision:
        provider: openai-codex
        model: gpt-6-sol
        timeout: 180
        reasoning_effort: low
      approval:
        provider: auto
      mcp:
        provider: auto
      goal_judge:
        provider: openai-codex
        model: gpt-6-sol
        timeout: 60
        reasoning_effort: low
      triage_specifier:
        provider: openai-codex
        model: gpt-6-sol
        timeout: 120
        reasoning_effort: medium
      title_generation:
        provider: openai-codex
        model: gpt-6-luna
        timeout: 60
        reasoning_effort: none
      skills_hub:
        provider: openai-codex
        model: gpt-6-luna
        timeout: 90
        reasoning_effort: none
      compression:
        provider: openai-codex
        model: gpt-6-sol
        timeout: 300
        reasoning_effort: low
      web_extract:
        provider: openai-codex
        model: gpt-6-luna
        timeout: 600
        reasoning_effort: none
      curator:
        provider: openai-codex
        model: gpt-6-sol
        timeout: 900
        reasoning_effort: medium
      session_search: null
      image_gen: null
    curator:
      backup:
        enabled: true
        keep: 10
    compression:
      enabled: true
      threshold: 0.75
      target_ratio: 0.30
      protect_last_n: 30
      protect_first_n: 0
      hygiene_hard_message_limit: 500
    stt:
      enabled: true
      provider: openai
      openai:
        model: Systran/faster-whisper-large-v3
        base_url: http://spark.a113.internal:8300/v1
        api_key: no-key-required
    tts:
      provider: openai
      speed: 1.0
      openai:
        model: openai/openai/gpt-4o-mini-tts
        voice: alloy
        speed: 1.0
        base_url: "${HERMES_BASE_URL}"
        api_key: "${HERMES_API_KEY}"
      edge:
        voice: en-US-AriaNeural
        speed: 1.0
    voice:
      record_key: ctrl+b
      max_recording_seconds: 120
      auto_tts: false
      beep_enabled: true
      silence_threshold: 200
      silence_duration: 3.0
    browser:
      inactivity_timeout: 120
      command_timeout: 60
    dashboard:
      theme: mono
    goals:
      max_turns: 20
    session_reset:
      mode: idle
      idle_minutes: 10080
      timezone: America/New_York
    agent:
      max_turns: 90
      api_max_retries: 3
    code_execution:
      mode: project
      timeout: 300
      max_tool_calls: 50
    file_read_max_chars: 100000
    tool_output:
      max_bytes: 150000
      max_lines: 5000
      max_line_length: 2000
    checkpoints:
      enabled: true
      max_snapshots: 20
      max_total_size_mb: 500
      max_file_size_mb: 10
      auto_prune: true
      retention_days: 7
      min_interval_hours: 24
    security:
      redact_secrets: true
    updates:
      pre_update_backup: false
      non_interactive_local_changes: stash
    kanban:
      enabled: false
      dispatch_in_gateway: false
    memory:
      memory_enabled: true
      user_profile_enabled: true
      memory_char_limit: 2200
      user_char_limit: 2200
      nudge_interval: 15
      flush_min_turns: 3
      provider: hindsight
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 180
      env_passthrough:
        # The custom image intentionally enables wildcard child-process env passthrough, including normally blocklisted provider/LLM/GH tokens (owner-approved GHSA-rhgp-j443-p4rf tradeoff).
        - "*"
    skills:
      # Pin the upstream grounded-citations skill into every session's prompt for evidence-based answers.
      auto_load:
        - grounded-citations
      disabled:
        - architecture-diagram
        - arxiv
        - ascii-art
        - ascii-video
        - airtable
        - audiocraft-audio-generation
        - axolotl
        - baoyu-article-illustrator
        - baoyu-comic
        - baoyu-infographic
        - claude-code
        - claude-design
        - coder-kanban-workflow
        - comfyui
        - debugging-hermes-tui-commands
        - design-md
        - dogfood
        - dspy
        - evaluating-llms-harness
        - excalidraw
        - fine-tuning-with-trl
        - godmode
        - google-workspace
        - heartmula
        - himalaya
        - huggingface-hub
        - jupyter-live-kernel
        - kanban-codex-lane
        - kanban-orchestrator
        - kanban-worker
        - linear
        - llama-cpp
        - manim-video
        - minecraft-modpack-server
        - notion
        - obliteratus
        - openhue
        - outlines
        - p5js
        - pixel-art
        - pokemon-player
        - popular-web-designs
        - powerpoint
        - pretext
        - research-paper-writing
        - segment-anything-model
        - serving-llms-vllm
        - sketch
        - songsee
        - songwriting-and-ai-music
        - teams-meeting-pipeline
        - touchdesigner-mcp
        - unsloth
        - weights-and-biases
        - xurl
        - youtube-content
        - yuanbao
      guard_agent_created: true
      creation_nudge_interval: 15
      config: {}
    plugins:
      enabled:
        - agent-farm
        - ivan-personal
        - paperless-approval
        - disk-cleanup
        - rtk-rewrite
        - web/ihub_search
        - security-guidance
    # TREK client_credentials tokens stay fresh on disk via the sidecar and Hermes reloads them by mtime.
    mcp_servers:
      trek:
        url: "https://trek.${CLUSTER_DOMAIN}/mcp"
        auth: oauth
        oauth:
          client_id: "${TREK_OAUTH_CLIENT_ID}"
          client_secret: "${TREK_OAUTH_CLIENT_SECRET}"
    web:
      search_backend: ihub
    gateway:
      # Upstream default "pair" DMs strangers a pairing code; "decline" sends one polite refusal then goes silent.
      unauthorized_dm_behavior: decline
    platforms:
      telegram:
        extra:
          drop_pending_updates: true
      # The API server health probe and in-cluster clients need this bind address.
      api_server:
        extra:
          host: "0.0.0.0"
    platform_toolsets:
      cli: &platform-toolsets
        - browser
        - clarify
        - code_execution
        - computer_use
        - cronjob
        - delegation
        - file
        - image_gen
        - ivan_bartender
        - ivan_books
        - ivan_budget
        - ivan_dining
        - ivan_documents
        - ivan_home_assistant
        - ivan_household
        - ivan_media
        - ivan_obsidian
        - ivan_paperless
        - ivan_synology
        - mcp-trek
        - memory
        - messaging
        - session_search
        - skills
        - terminal
        - todo
        - tts
        - vision
        - web
      telegram: *platform-toolsets
    known_plugin_toolsets:
      cli: &known-plugin-toolsets
        - paperless-approval
        - ivan_bartender
        - ivan_books
        - ivan_budget
        - ivan_dining
        - ivan_documents
        - ivan_home_assistant
        - ivan_household
        - ivan_media
        - ivan_obsidian
        - ivan_paperless
        - ivan_synology
      telegram: *known-plugin-toolsets
