controllers:
  app:
    replicas: 1
    strategy: Recreate
    annotations:
      configmap.reloader.stakater.com/reload: hermes-agent-config
      secret.reloader.stakater.com/reload: hermes-agent-secret
    pod:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      00-restore-permissions:
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260920015331-2bac6a0-oci
        command:
        - python
        - -c
        - |
          import os

          path = "/opt/data/.config/gogcli"
          if os.path.lexists(path):
              for root, dirs, files in os.walk(path, followlinks=False):
                  os.chown(root, 10000, 10000, follow_symlinks=False)
                  for name in dirs + files:
                      os.chown(os.path.join(root, name), 10000, 10000, follow_symlinks=False)

        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
      seed-config:
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260920015331-2bac6a0-oci
        command: ["hermes-seed-config"]
        envFrom:
        - secretRef:
            name: hermes-agent-secret
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          capabilities: {drop: ["ALL"]}
      # Install the Git plugin through upstream Hermes at the current main commit.
      plugins-install:
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260920015331-2bac6a0-oci
        command:
          - /bin/sh
          - -ec
          - |
            /opt/hermes/.venv/bin/hermes plugins install --force --no-enable \
              --ref 0cf7bc69ea43cb0a1a9c3a08c1bbfac90564bb52 \
              "https://gitea.a113.casa/vpogu/ivan-plugin.git#plugin"
        env:
          HOME: /opt/data
          HERMES_HOME: /opt/data
          PYTHONUNBUFFERED: "1"
          GITEA_USER:
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secret
                key: GITEA_USER
          GITEA_TOKEN:
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secret
                key: GITEA_TOKEN
          # Git insteadOf token auth keeps the token out of argv and recorded plugin source URLs.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://$(GITEA_USER):$(GITEA_TOKEN)@gitea.a113.casa/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://gitea.a113.casa/"
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          capabilities: {drop: ["ALL"]}
      # The native sidecar refreshes shared-PVC MCP OAuth tokens without a browser (TREK client_credentials and Coroot headless authorization_code).
      mcp-token-sidecar:
        restartPolicy: Always
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260920015331-2bac6a0-oci
        command: ["python", "/usr/local/bin/hermes-mcp-tokens"]
        env:
          PYTHONUNBUFFERED: "1"
          TREK_URL: "https://trek.${CLUSTER_DOMAIN}"
          TREK_OAUTH_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secret
                key: TREK_OAUTH_CLIENT_ID
          TREK_OAUTH_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secret
                key: TREK_OAUTH_CLIENT_SECRET
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          capabilities: {drop: ["ALL"]}
    containers:
      app:
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260920015331-2bac6a0-oci
        probes:
          # Let startupProbe cover the variable 40s–2.5m cold start before liveness/readiness take over to avoid kill loops.
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["curl", "-fsS", "http://127.0.0.1:8642/health"]
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 40
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["curl", "-fsS", "http://127.0.0.1:8642/health"]
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["curl", "-fsS", "http://127.0.0.1:8642/health"]
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
        args:
        - gateway
        - run
        env:
          PATH: /usr/local/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          HOME: /opt/data
          HERMES_HOME: /opt/data
          XDG_CONFIG_HOME: /opt/data/.config
          XDG_DATA_HOME: /opt/data/.local/share
          XDG_CACHE_HOME: /opt/data/.cache
          CODEX_HOME: /opt/data/.codex
          CLAUDE_CONFIG_DIR: /opt/data/.claude
          AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
          PLAYWRIGHT_BROWSERS_PATH: /opt/data/.cache/ms-playwright
          PUPPETEER_CACHE_DIR: /opt/data/.cache/puppeteer
          PYTHONUNBUFFERED: "1"
          HERMES_DASHBOARD: "1"
          HERMES_DASHBOARD_HOST: "0.0.0.0"
          HERMES_DASHBOARD_PORT: &dashboardPort 9119
          API_SERVER_ENABLED: "true"
          API_SERVER_HOST: "127.0.0.1"
          API_SERVER_PORT: "8642"
          HINDSIGHT_API_URL: http://hindsight-api.ai.svc.cluster.local:8888
          HINDSIGHT_BANK_ID: global
          SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
          TZ: America/New_York
        envFrom:
        - secretRef:
            name: hermes-agent-secret
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
service:
  app:
    controller: app
    ports:
      dashboard:
        port: *dashboardPort
persistence:
  app-data:
    existingClaim: hermes-agent
    advancedMounts:
      app:
        00-restore-permissions:
        - path: /opt/data
        seed-config:
        - path: /opt/data
        plugins-install:
        - path: /opt/data
        app:
        - path: /opt/data
        mcp-token-sidecar:
        - path: /opt/data
  config:
    type: configMap
    name: hermes-agent-config
    advancedMounts:
      app:
        seed-config:
        - path: /opt/bootstrap/config.yaml
          subPath: config.yaml
          readOnly: true
