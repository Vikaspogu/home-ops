serviceAccount:
  hermes-cluster-reader:
    forceRename: hermes-cluster-reader
    automountServiceAccountToken: false
controllers:
  app:
    replicas: 1
    strategy: Recreate
    annotations:
      configmap.reloader.stakater.com/reload: hermes-agent-config
      secret.reloader.stakater.com/reload: hermes-agent-secret
    pod:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      identifier: hermes-cluster-reader
    initContainers:
      00-restore-permissions:
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260727121950-e57aa7d-oci
        command:
        - python
        - -c
        - |
          import os

          path = "/opt/data/.config/gogcli"
          if os.path.lexists(path):
              for root, dirs, files in os.walk(path, followlinks=False):
                  os.chown(root, 10000, 10000, follow_symlinks=False)
                  for name in dirs + files:
                      os.chown(os.path.join(root, name), 10000, 10000, follow_symlinks=False)

          alert_state = "/opt/data/alert-intake"
          if os.path.islink(alert_state):
              raise RuntimeError("refusing symlinked alert intake state")
          os.makedirs(alert_state, mode=0o700, exist_ok=True)
          os.chown(alert_state, 10000, 10000, follow_symlinks=False)
          # CSI rejects chmod here; the bridge writes its cursor atomically as 0600.
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
      seed-config:
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260831123916-3ce21d5-oci
        command: ["hermes-seed-config"]
        envFrom:
        - secretRef:
            name: hermes-agent-secret
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          capabilities: {drop: ["ALL"]}
      hermes-bootstrap:
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260831123916-3ce21d5-oci
        command: ["python", "/etc/hermes-bootstrap/bootstrap.py"]
        env:
          PYTHONUNBUFFERED: "1"
        envFrom:
        - secretRef:
            name: hermes-agent-secret
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          capabilities: {drop: ["ALL"]}
      # Native sidecar: keeps MCP OAuth tokens fresh on the shared PVC so
      # hermes never needs a browser flow (TREK hourly client_credentials,
      # Coroot headless authorization_code bootstrap).
      mcp-token-sidecar:
        restartPolicy: Always
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260715000636-fdb6d67-oci
        command: ["python", "/usr/local/bin/hermes-mcp-tokens"]
        env:
          PYTHONUNBUFFERED: "1"
          TREK_URL: "https://trek.${CLUSTER_DOMAIN}"
          COROOT_URL: "https://coroot.${CLUSTER_DOMAIN}"
        envFrom:
        - secretRef:
            name: hermes-agent-secret
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          capabilities: {drop: ["ALL"]}
      ntfy-alert-bridge:
        restartPolicy: Always
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260828230449-f97afd0-oci
        command: ["python", "/usr/local/bin/hermes-ntfy-alert-bridge"]
        env:
          PYTHONUNBUFFERED: "1"
          NTFY_SERVER_URL: http://ntfy.default.svc.cluster.local
          NTFY_TOPIC: infra-alerts
          NTFY_CURSOR_FILE: /var/lib/hermes-alert-intake/cursor
          HERMES_ALERT_WEBHOOK_URL: http://127.0.0.1:8644/webhooks/kubernetes-alert
          NTFY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: hermes-alert-intake-secret
                key: NTFY_TOKEN
          WEBHOOK_SECRET:
            valueFrom:
              secretKeyRef:
                name: hermes-alert-intake-secret
                key: WEBHOOK_SECRET
        resources:
          requests:
            cpu: 5m
            memory: 24Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          capabilities: {drop: ["ALL"]}
    containers:
      app:
        image:
          repository: gitea.a113.casa/vpogu/agent-platform-hermes-agent
          tag: 20260831123916-3ce21d5-oci
        args:
        - gateway
        - run
        env:
          PATH: /usr/local/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          HOME: /opt/data
          HERMES_HOME: /opt/data
          XDG_CONFIG_HOME: /opt/data/.config
          XDG_DATA_HOME: /opt/data/.local/share
          XDG_CACHE_HOME: /opt/data/.cache
          CODEX_HOME: /opt/data/.codex
          CLAUDE_CONFIG_DIR: /opt/data/.claude
          AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
          PLAYWRIGHT_BROWSERS_PATH: /opt/data/.cache/ms-playwright
          PUPPETEER_CACHE_DIR: /opt/data/.cache/puppeteer
          PYTHONUNBUFFERED: "1"
          HERMES_DASHBOARD: "1"
          HERMES_DASHBOARD_HOST: "0.0.0.0"
          HERMES_DASHBOARD_PORT: &dashboardPort 9119
          API_SERVER_ENABLED: "true"
          API_SERVER_HOST: "127.0.0.1"
          API_SERVER_PORT: "8642"
          AGENTMEMORY_URL: http://agentmemory.ai.svc.cluster.local:3111
          SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
          PROMETHEUS_URL: http://prometheus-prometheus.observability.svc.cluster.local:9090
          HERMES_NEMO_RELAY_PLUGINS_TOML: /opt/data/nemo-relay-plugins.toml
          WEBHOOK_ENABLED: "true"
          WEBHOOK_SECRET:
            valueFrom:
              secretKeyRef:
                name: hermes-alert-intake-secret
                key: WEBHOOK_SECRET
          TZ: America/New_York
        envFrom:
        - secretRef:
            name: hermes-agent-secret
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
service:
  app:
    controller: app
    ports:
      dashboard:
        port: *dashboardPort
persistence:
  app-data:
    existingClaim: hermes-agent
    advancedMounts:
      app:
        00-restore-permissions:
        - path: /opt/data
        seed-config:
        - path: /opt/data
        hermes-bootstrap:
        - path: /opt/data
        app:
        - path: /opt/data
        mcp-token-sidecar:
        - path: /opt/data
        ntfy-alert-bridge:
        - path: /var/lib/hermes-alert-intake
          subPath: alert-intake
  config:
    type: configMap
    name: hermes-agent-config
    advancedMounts:
      app:
        seed-config:
        - path: /opt/bootstrap/config.yaml
          subPath: config.yaml
          readOnly: true
        hermes-bootstrap:
        - path: /opt/bootstrap/config.yaml
          subPath: config.yaml
          readOnly: true
        - path: /opt/data/nemo-relay-plugins.toml
          subPath: nemo-relay-plugins.toml
          readOnly: true
        # The app container must see the ConfigMap content, not the PVC's
        # stale placeholder at the same path — HERMES_NEMO_RELAY_PLUGINS_TOML
        # points here and the plugin silently no-ops on an empty file.
        app:
        - path: /opt/data/nemo-relay-plugins.toml
          subPath: nemo-relay-plugins.toml
          readOnly: true
  bootstrap:
    type: configMap
    name: hermes-bootstrap
    advancedMounts:
      app:
        hermes-bootstrap:
        - path: /etc/hermes-bootstrap/bootstrap.py
          subPath: bootstrap.py
          readOnly: true
        - path: /etc/hermes-bootstrap/config.yaml
          subPath: config.yaml
          readOnly: true
  secret:
    type: secret
    name: hermes-agent-secret
    advancedMounts:
      app:
        app:
        - path: /opt/data/.env
          subPath: .env
          readOnly: true
  kubernetes-api:
    type: custom
    volumeSpec:
      projected:
        sources:
        - serviceAccountToken:
            expirationSeconds: 3600
            path: token
        - configMap:
            name: kube-root-ca.crt
            items:
            - key: ca.crt
              path: ca.crt
        - downwardAPI:
            items:
            - path: namespace
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
    advancedMounts:
      app:
        app:
        - path: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
