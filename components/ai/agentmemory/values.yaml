controllers:
  agentmemory:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      imagePullSecrets:
      - name: gitea-registry-secret
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: gitea.a113.casa/vpogu/agentmemory
          tag: &agentmemoryTag 20260828131240-e7787b4-oci
        command:
        - /usr/bin/catatonit
        - --
        - /bin/sh
        - -c
        - |
          PREFS_HOME="${HOME:-/home/node}"
          mkdir -p "$PREFS_HOME/.agentmemory"
          if [ ! -s "$PREFS_HOME/.agentmemory/preferences.json" ]; then
            printf '%s\n' '{"schemaVersion":1,"lastAgent":null,"lastAgents":[],"lastProvider":null,"skipSplash":true,"skipNpxHint":true,"skipGlobalInstall":true,"skipConsoleInstall":true,"firstRunAt":"1970-01-01T00:00:00.000Z"}' > "$PREFS_HOME/.agentmemory/preferences.json"
          fi
          exec /entrypoint.sh
        env:
          TZ: America/New_York
          III_REST_PORT: "3111"
          RUST_LOG: warn
          AGENTMEMORY_DROP_STALE_INDEX: "true"
          OPENAI_API_KEY: no-key-required
          OPENAI_BASE_URL: http://127.0.0.1:11435/v1
          OPENAI_MODEL: qwen3.6:35b-a3b-q8_0
          OPENAI_EMBEDDING_MODEL: nvidia/qwen/qwen3-embedding-0.6b
          OPENAI_EMBEDDING_DIMENSIONS: "1024"
          # Restore hybrid weighting after the preserved sparse vector index is fully reindexed.
          BM25_WEIGHT: "1"
          VECTOR_WEIGHT: "0"
          GRAPH_EXTRACTION_ENABLED: "true"
          AGENTMEMORY_AUTO_COMPRESS: "true"
          AGENTMEMORY_INJECT_CONTEXT: "true"
          AGENTMEMORY_VERBOSE: "true"
          REBUILD_EMBED_BATCH_SIZE: "64"
          AGENTMEMORY_VIEWER_HOST: "0.0.0.0"
          VIEWER_ALLOWED_HOSTS: "agentmemory.${CLUSTER_DOMAIN}"
          VIEWER_ALLOWED_ORIGINS: "https://agentmemory.${CLUSTER_DOMAIN}"
        envFrom:
        - secretRef:
            name: agentmemory-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /agentmemory/livez
                port: &apiPort 3111
              failureThreshold: 60
              periodSeconds: 5
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /agentmemory/livez
                port: *apiPort
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /agentmemory/livez
                port: *apiPort
              failureThreshold: 3
              periodSeconds: 30
              timeoutSeconds: 5
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            memory: 12Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      metrics-proxy:
        image:
          repository: gitea.a113.casa/vpogu/agentmemory
          tag: *agentmemoryTag
        command:
        - node
        - /app/metrics-proxy.mjs
        env:
          OLLAMA_URL: http://spark.a113.internal:11434
          OLLAMA_MODEL: qwen3.6:35b-a3b-q8_0
          OLLAMA_REASONING_EFFORT: none
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /metrics
                port: &metricsPort 9090
              failureThreshold: 12
              periodSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /metrics
                port: *metricsPort
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /metrics
                port: *metricsPort
              periodSeconds: 30
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
service:
  app:
    controller: agentmemory
    ports:
      api:
        port: 3111
      stream:
        port: 3112
      viewer:
        port: 3113
      metrics:
        port: 9090
persistence:
  data:
    existingClaim: agentmemory
    globalMounts:
    - path: /data
  tmp:
    type: emptyDir
    globalMounts:
    - path: /tmp
