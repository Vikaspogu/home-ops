---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentmemory
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentmemory-secret
    template:
      engineVersion: v2
      data:
        AGENTMEMORY_SECRET: "{{ .AGENTMEMORY_SECRET }}"
        # Preserve the existing embedding provider and vector space.
        OPENAI_EMBEDDING_API_KEY: "{{ .INFERENCE_HUB_CODING_KEY }}"
        OPENAI_EMBEDDING_BASE_URL: "{{ .INFERENCE_HUB_BASE_URL }}"
  dataFrom:
    - extract:
        key: agentmemory
    - extract:
        key: inference-hub
