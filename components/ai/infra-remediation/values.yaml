---
controllers:
  app:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: gitea.a113.casa/vpogu/infra-remediation
          tag: 20260825133405-083e268-oci@sha256:b28311fa9b5981846022459755bda044e701102f7670b039b69c0411b28616f8
        args: ["--serve"]
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          INFRA_REMEDIATION_ALLOWED_PR_PREFIXES: '{"home-ops":"https://github.com/Vikaspogu/home-ops/pull/"}'
          INFRA_REMEDIATION_ALLOWED_TARGETS: '[["home-ops","gitops-update"]]'
          INFRA_REMEDIATION_DB: /var/lib/infra-remediation/state.db
          INFRA_REMEDIATION_FORGE_URL: http://forge-orchestrator.ai.svc.cluster.local:8080
          INFRA_REMEDIATION_HERMES_CARD_URL: http://hermes-agent.ai.svc.cluster.local:8644/webhooks/infra-card
          INFRA_REMEDIATION_HERMES_INVESTIGATION_URL: http://hermes-agent.ai.svc.cluster.local:8644/webhooks/infra-alert
          INFRA_REMEDIATION_HERMES_CARD_UPDATE_URL: http://hermes-agent.ai.svc.cluster.local:8644/webhooks/infra-card-update
          INFRA_REMEDIATION_PORT: "8080"
        envFrom:
          - secretRef:
              name: infra-remediation-secret
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 20
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 3
              periodSeconds: 10
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true

service:
  app:
    controller: app
    ports:
      http:
        port: 8080

persistence:
  data:
    existingClaim: infra-remediation
    globalMounts:
      - path: /var/lib/infra-remediation
