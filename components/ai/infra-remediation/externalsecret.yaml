---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-remediation-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: infra-remediation-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INFRA_REMEDIATION_ALERT_TOKEN: "{{ .REMEDIATION_ALERT_TOKEN }}"
        # Phase 1 is single-operator: the authorized user is also the card chat.
        INFRA_REMEDIATION_APPROVAL_USER_IDS: "{{ .TELEGRAM_ALLOWED_USER_ID }}"
        INFRA_REMEDIATION_DECISION_SECRET: "{{ .REMEDIATION_DECISION_SECRET }}"
        INFRA_REMEDIATION_FORGE_TOKEN: "{{ .FORGE_INTAKE_TOKEN }}"
        INFRA_REMEDIATION_HERMES_CARD_SECRET: "{{ .REMEDIATION_HERMES_WEBHOOK_SECRET }}"
        INFRA_REMEDIATION_HERMES_INVESTIGATION_SECRET: "{{ .REMEDIATION_HERMES_WEBHOOK_SECRET }}"
        INFRA_REMEDIATION_HERMES_UPDATE_SECRET: "{{ .REMEDIATION_HERMES_WEBHOOK_SECRET }}"
        INFRA_REMEDIATION_PROPOSAL_SECRET: "{{ .REMEDIATION_PROPOSAL_SECRET }}"
        INFRA_REMEDIATION_TELEGRAM_CHAT_ID: "{{ .TELEGRAM_ALLOWED_USER_ID }}"
  data:
    - secretKey: REMEDIATION_ALERT_TOKEN
      remoteRef:
        key: ivan
        property: REMEDIATION_ALERT_TOKEN
    - secretKey: TELEGRAM_ALLOWED_USER_ID
      remoteRef:
        key: ivan
        property: TELEGRAM_ALLOWED_USER_ID
    - secretKey: REMEDIATION_DECISION_SECRET
      remoteRef:
        key: ivan
        property: REMEDIATION_DECISION_SECRET
    - secretKey: FORGE_INTAKE_TOKEN
      remoteRef:
        key: forge
        property: FORGE_INTAKE_TOKEN
    - secretKey: REMEDIATION_HERMES_WEBHOOK_SECRET
      remoteRef:
        key: ivan
        property: REMEDIATION_HERMES_WEBHOOK_SECRET
    - secretKey: REMEDIATION_PROPOSAL_SECRET
      remoteRef:
        key: ivan
        property: REMEDIATION_PROPOSAL_SECRET
