replicaCount: 1

workload:
  kind: Deployment

server:
  telemetryEnabled: false
  sandboxNamespace: openshell-sandboxes
  externalDbSecret: openshell-db-secret
  credentialStorage:
    existingSecret: openshell-db-secret
  auth:
    allowUnauthenticatedUsers: true
  disableTls: false
  logLevel: info
  sandboxImagePullSecrets:
    - name: gitea-registry-secret

gateway:
  image:
    repository: openshell/gateway
    tag: "0.1.1"
    pullPolicy: Always

sandbox:
  image:
    repository: gitea.a113.casa/vpogu/openshell-sandbox
    tag: latest-oci
    pullPolicy: Always

# Pin supervisor and gateway to the same release; version skew breaks bootstrap.
supervisor:
  image:
    repository: openshell/supervisor
    tag: "0.1.1"
    pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080

# Pin server cert SANs to ns ai; default SANs hardcode ns openshell so sandbox agents fail TLS to openshell.ai.svc.cluster.local.
pkiInitJob:
  serverDnsNames:
    - openshell
    - openshell.ai.svc
    - openshell.ai.svc.cluster.local
    - localhost

# Skip the chart CRD preflight because ArgoCD renders offline while the cluster already serves agents.x-k8s.io/v1beta1.
agentSandbox:
  preflight:
    enabled: false
