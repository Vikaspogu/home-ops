# Restrict the unauthenticated gateway client API to managed sandboxes because the chart policy covers only sandbox SSH; OIDC is deferred.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshell-gateway-client-api
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: openshell
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Sandbox pods lack openshell.ai/managed-by, so restrict them by their dedicated namespace.
        - namespaceSelector:
            matchLabels:
              openshell.io/sandbox-namespace: "true"
      ports:
        - protocol: TCP
          port: 8080
