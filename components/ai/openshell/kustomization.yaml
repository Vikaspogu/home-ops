# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./sandbox-namespace.yaml
  - ./externalsecret.yaml
  - ./pvc.yaml
  - ./networkpolicy-client.yaml
  - ./reflect-client-tls.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openshell
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            initContainers:
              - name: init-db
                image: ghcr.io/home-operations/postgres-init:18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
                envFrom:
                  - secretRef:
                      name: openshell-db-secret
            containers:
              - name: openshell-gateway
                volumeMounts:
                  - name: state
                    mountPath: /.local/state/openshell
            volumes:
              - name: state
                persistentVolumeClaim:
                  claimName: openshell-state
helmCharts:
  - name: helm-chart
    releaseName: openshell
    namespace: ai
    repo: oci://ghcr.io/nvidia/openshell
    version: "0.1.4"
    valuesFile: values.yaml
    includeCRDs: false
