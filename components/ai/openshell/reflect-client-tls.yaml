# Reflect the certgen-created client TLS secret into the sandbox namespace so gateway mounts succeed; a PostSync hook adds persistent reflector annotations because certgen cannot update it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-reflect-client-tls
  namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshell-reflect-client-tls
  namespace: ai
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openshell-client-tls"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-reflect-client-tls
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshell-reflect-client-tls
subjects:
  - kind: ServiceAccount
    name: openshell-reflect-client-tls
    namespace: ai
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openshell-reflect-client-tls
  namespace: ai
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: openshell-reflect-client-tls
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.37.0@sha256:5ed410ebac5dc976cc717098994dcdb29bbbd38f6bd65f582311f5be4ba719cf
          command:
            - kubectl
            - annotate
            - secret
            - openshell-client-tls
            - -n
            - ai
            - --overwrite
            - reflector.v1.k8s.emberstack.com/reflection-allowed=true
            - reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces=openshell-sandboxes
            - reflector.v1.k8s.emberstack.com/reflection-auto-enabled=true
            - reflector.v1.k8s.emberstack.com/reflection-auto-namespaces=openshell-sandboxes
