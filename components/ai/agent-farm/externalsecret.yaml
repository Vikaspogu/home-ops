---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-farm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-farm-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgres://{{ .AGENT_FARM_POSTGRES_USER }}:{{ .AGENT_FARM_POSTGRES_PASS }}@postgres17-rw.default.svc.cluster.local:5432/agent_farm
        INIT_POSTGRES_DBNAME: agent_farm
        INIT_POSTGRES_HOST: postgres17-rw.default.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .AGENT_FARM_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .AGENT_FARM_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        internal-tls.crt: "{{ .INTERNAL_TLS_CRT }}"
        internal-tls.key: "{{ .INTERNAL_TLS_KEY }}"
        internal-ca.crt: "{{ .INTERNAL_CA_CRT }}"
        workload-ca.crt: "{{ .WORKLOAD_CA_CRT }}"
        workload-ca.key: "{{ .WORKLOAD_CA_KEY }}"
        workload-client-ca.crt: "{{ .WORKLOAD_CA_CRT }}"
  dataFrom:
    - extract:
        key: agent-farm
    - extract:
        key: cloudnative-pg
