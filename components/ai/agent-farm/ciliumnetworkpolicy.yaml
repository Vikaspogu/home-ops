---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-farm-kube-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: agent-farm
      app.kubernetes.io/name: agent-farm
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
