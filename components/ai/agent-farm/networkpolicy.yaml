---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-farm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: agent-farm
      app.kubernetes.io/name: agent-farm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${GATEWAY_NAMESPACE}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: agent-farm.io/workspace-id
                operator: Exists
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres17
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${GATEWAY_NAMESPACE}
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      # Cilium may enforce the service port before or the backend port after DNAT.
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 10443
