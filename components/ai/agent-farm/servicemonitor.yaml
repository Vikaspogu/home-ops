---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-farm
  labels:
    app.kubernetes.io/instance: agent-farm
    app.kubernetes.io/name: agent-farm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent-farm
      app.kubernetes.io/name: agent-farm
      app.kubernetes.io/service: agent-farm
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
      metricRelabelings:
        - action: labeldrop
          regex: (pod)
