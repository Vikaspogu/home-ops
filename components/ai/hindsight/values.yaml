# Official Hindsight chart using the shared barman-backed CNPG pgvector17 cluster; docs: https://hindsight.vectorize.io/developer/installation

# hindsight-secret supplies the DB password, tenant key, NVIDIA embeddings key/base URL, and dummy Ollama LLM key.
existingSecret: hindsight-secret
# Accepted chart deviations: the internal-only UI pod receives DB/tenant secrets, and chart-wide writable root filesystems are required by Next.js; revisit before public exposure.

podAnnotations:
  reloader.stakater.com/auto: "true"

api:
  env:
    TZ: America/New_York
    # Extraction/consolidation/mental-model-refresh LLM: Ollama on spark.
    # Interactive reflect is split off to the hosted hub below.
    HINDSIGHT_API_LLM_PROVIDER: "ollama"
    HINDSIGHT_API_LLM_MODEL: "qwen3.6:35b-a3b-q8_0"
    HINDSIGHT_API_LLM_BASE_URL: "http://spark.a113.internal:11434"
    HINDSIGHT_API_LLM_OLLAMA_NUM_CTX: "65536" # hindsight requires >=64K ctx
    HINDSIGHT_API_LLM_MAX_CONCURRENT: "8" # global room; per-op caps below reserve slots for reflect
    HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT: "2" # extraction: 2 GPU slots, queues on its own cap
    HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT: "2"
    HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_MAX_CONCURRENT: "2"
    # Reflect on the hosted inference hub (OpenAI-compatible), same creds pattern as embeddings.
    # Non-reasoning instruct variant: reasoning models overshoot the per-call read timeout.
    HINDSIGHT_API_REFLECT_LLM_PROVIDER: "openai"
    HINDSIGHT_API_REFLECT_LLM_MODEL: "nvidia/qwen/qwen3-next-80b-a3b-instruct"
    # low=1 iteration skips forced retrieval entirely (empty answers) — 2 is the
    # minimum viable: retrieve then synthesize. low budget = 2 iterations
    # (~20s, fits pi's auto-hook cap); high-budget tool reflects get 8.
    HINDSIGHT_API_REFLECT_MAX_ITERATIONS: "4"
    # Embeddings: NVIDIA inference hub.
    HINDSIGHT_API_EMBEDDINGS_PROVIDER: "openai"
    HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: "nvidia/qwen/qwen3-embedding-0.6b"
    HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: "1024"
    # RRF fusion only — local MiniLM reranking was CPU-starving recall under concurrent reflects.
    HINDSIGHT_API_ENABLE_RERANKING: "true"
    # (provider "none" is mentioned in hindsight docs but rejected by the factory.)
    HINDSIGHT_API_RERANKER_PROVIDER: "rrf"
    # Bearer auth for all clients (pi plugin, Hermes provider, MCP).
    HINDSIGHT_API_TENANT_EXTENSION: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
  resources:
    requests:
      cpu: 1000m
      memory: 512Mi
    limits:
      memory: 2Gi

controlPlane:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi

# API's internal worker is enough at this scale.
worker:
  enabled: false

postgresql:
  enabled: false
  external:
    host: pgvector17-rw.default.svc.cluster.local
    port: 5432
    database: hindsight
    username: hindsight

metrics:
  serviceMonitor:
    enabled: true
