---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app hindsight
  labels:
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
  annotations:
    gethomepage.dev/href: "https://hindsight.${CLUSTER_DOMAIN}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Ingress
    gethomepage.dev/name: hindsight
    gethomepage.dev/description: "Agent memory that learns"
    gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/basic-memory.png
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["hindsight.${CLUSTER_DOMAIN}"]
  rules:
    # REST API + per-bank MCP endpoints → API server (port 8888).
    # Tenant Bearer auth (HINDSIGHT_API_TENANT_*) gates these paths.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: hindsight-api
          port: 8888
    # Control-plane UI → port 3000. No built-in auth: safe only because
    # ${GATEWAY_NAME} resolves to envoy-internal (LAN/VPN-only exposure).
    # Never move this rule to envoy-external without adding auth first.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hindsight-control-plane
          port: 3000
