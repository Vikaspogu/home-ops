---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app hindsight
  labels:
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["hindsight.${CLUSTER_DOMAIN}"]
  rules:
    # REST API + per-bank MCP endpoints → API server (port 8888).
    # Tenant Bearer auth (HINDSIGHT_API_TENANT_*) gates these paths.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: hindsight-api
          port: 8888
    # The control-plane UI has no built-in auth, so it is deliberately NOT
    # exposed. Browse it with:
    #   kubectl -n ai port-forward svc/hindsight-control-plane 3000:3000
