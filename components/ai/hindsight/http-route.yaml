---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app hindsight
  labels:
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
  annotations:
    gethomepage.dev/href: "https://hindsight.${CLUSTER_DOMAIN}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Ingress
    gethomepage.dev/name: hindsight
    gethomepage.dev/description: "Agent memory that learns"
    gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/basic-memory.png
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["hindsight.${CLUSTER_DOMAIN}"]
  rules:
    # Tenant Bearer auth protects REST API and per-bank MCP paths on port 8888.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: hindsight-api
          port: 8888
    # The unauthenticated control-plane UI is safe only on the LAN/VPN internal gateway; add auth before any external exposure.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hindsight-control-plane
          port: 3000
