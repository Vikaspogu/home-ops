---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: hindsight
spec:
    secretStoreRef:
        kind: ClusterSecretStore
        name: onepassword-connect
    target:
        name: hindsight-secret
        template:
            engineVersion: v2
            data:
                postgres-password: "{{ .POSTGRES_PASSWORD }}"
                HINDSIGHT_API_TENANT_API_KEY: "{{ .HINDSIGHT_API_KEY }}"
                # Control plane: browser login key + the Bearer it uses against the API.
                HINDSIGHT_CP_ACCESS_KEY: "{{ .HINDSIGHT_API_KEY }}"
                HINDSIGHT_CP_DATAPLANE_API_KEY: "{{ .HINDSIGHT_API_KEY }}"
                HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: "{{ .INFERENCE_HUB_CODING_KEY }}"
                HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: "{{ .INFERENCE_HUB_BASE_URL }}"
                # Reflect chat model: same hub creds as embeddings.
                HINDSIGHT_API_REFLECT_LLM_API_KEY: "{{ .INFERENCE_HUB_CODING_KEY }}"
                HINDSIGHT_API_REFLECT_LLM_BASE_URL: "{{ .INFERENCE_HUB_BASE_URL }}"
                # Ollama requires a non-empty key but ignores the value.
                HINDSIGHT_API_LLM_API_KEY: "no-key-required"
    dataFrom:
        - extract:
              key: hindsight
        - extract:
              key: inference-hub
