---
# Companion ingress: only Envoy Gateway reaches it (the outer forward-auth gate and the
# inner cookie gate both live behind that path). No in-cluster callers hit the app port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-companion-ingress
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-companion
  policyTypes: [Ingress]
  ingress:
    # ${GATEWAY_NAME} resolved live = envoy-internal (same gateway as hermes-agent
    # and agent-farm; envoy-external serves nothing on these hosts).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - protocol: TCP
          port: 8080
---
# Companion egress: DNS, the Hermes api_server, the Authentik outpost, and OpenAI
# (Realtime WS). Once this CiliumNetworkPolicy selects the pod, everything else is denied
# (design §AuthN/Z NetworkPolicy row). The explicit kube-system DNS section is REQUIRED
# with toFQDNs — Cilium's DNS proxy must observe answers for the FQDN rule to match.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-companion-egress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-companion
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Hermes upstream (api_server platform, port 8642 — needs the hermes-agent service
    # port addition + configmap host bind, see NOTES.md prerequisites).
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": ai
            "k8s:app.kubernetes.io/name": hermes-agent
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP
    # Authentik outpost (cookie validation) — the shared domain-level forward-auth
    # outpost lives in the agent-farm namespace.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": agent-farm
            "k8s:app.kubernetes.io/name": authentik-outpost-proxy
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # OpenAI Realtime (voice relay) + the static TLS front for api.openai.com.
    - toFQDNs:
        - matchPattern: "api.openai.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
