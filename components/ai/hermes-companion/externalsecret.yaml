---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-companion
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-companion-secret
    template:
      engineVersion: v2
      data:
        # Same API key the api_server platform validates (1Password "hermes" item).
        HERMES_API_KEY: "{{ .HERMES_API_SERVER_KEY }}"
        # Voice relay (Phase 1 task 1.5). 1Password item "hermes-companion" — see NOTES.md; the OpenAI org that owns this key should be reviewed for Zero Data Retention (preflight 0.5): /v1/realtime is ZDR-eligible, default is 30-day abuse logs.
        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        REALTIME_MODEL: "{{ .REALTIME_MODEL }}"
        # Dedicated smoke credential: scoped (health + shell + one canned chat turn), never a general auth bypass. Rotation = edit this item. The TTL is hardcoded in values.yaml env (GitOps-visible kill-switch).
        SMOKE_TOKEN: "{{ .SMOKE_TOKEN }}"
  data:
    - secretKey: HERMES_API_SERVER_KEY
      remoteRef:
        key: hermes
        property: HERMES_API_SERVER_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: hermes-companion
        property: OPENAI_API_KEY
    - secretKey: REALTIME_MODEL
      remoteRef:
        key: hermes-companion
        property: REALTIME_MODEL
    - secretKey: SMOKE_TOKEN
      remoteRef:
        key: hermes-companion
        property: SMOKE_TOKEN
