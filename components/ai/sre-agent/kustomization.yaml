---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Preserve explicit cross-namespace RBAC resources (e.g. rook-ceph Role/RoleBinding in rbac.yaml)
# while defaulting resources without an explicit namespace to sre-agent.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: sre-agent-namespace
      namespace: sre-agent
    unsetOnly: true
resources:
  - ./namespace.yaml
  - ./externalsecret.yaml
  - ./http-route.yaml
  - ./rbac.yaml
components:
  - ../../volsync-system/volsync-replication

helmCharts:
  - name: app-template
    releaseName: sre-agent
    namespace: sre-agent
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: "5.3.0"
    valuesFile: values.yaml
