---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre-agent
resources:
  - ./namespace.yaml
  - ./externalsecret.yaml
  - ./http-route.yaml
  - ./rbac.yaml
components:
  - ../../volsync-system/volsync-replication

helmCharts:
  - name: app-template
    releaseName: sre-agent
    namespace: sre-agent
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: "5.3.0"
    valuesFile: values.yaml
