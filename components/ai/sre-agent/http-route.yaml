---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app sre-agent
  labels:
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
  annotations:
    gethomepage.dev/href: "https://sre-agent.${CLUSTER_DOMAIN}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Ingress
    gethomepage.dev/icon: mdi-robot-outline
    gethomepage.dev/name: SRE Agent
    gethomepage.dev/description: Durable on-call SRE agent
    gethomepage.dev/app: sre-agent
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=sre-agent
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: https
  hostnames: ["sre-agent.${CLUSTER_DOMAIN}"]
  rules:
    - backendRefs:
        - name: *app
          port: 4781
