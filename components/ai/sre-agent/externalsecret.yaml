---
# 1Password item "sre-agent" must contain:
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sre-agent-secret
    template:
      engineVersion: v2
      data:
        DPI_TOKEN: "{{ .DPI_TOKEN }}"
        SWEEP_HEARTBEAT_URL: "{{ .SWEEP_HEARTBEAT_URL }}"
        INFERENCE_HUB_BASE_URL: "{{ .INFERENCE_HUB_BASE_URL }}"
        INFERENCE_HUB_API_KEY: "{{ .INFERENCE_HUB_CODING_KEY }}"
  dataFrom:
    - extract:
        key: sre-agent
    - extract:
        key: inference-hub
