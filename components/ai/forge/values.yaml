serviceAccount:
  forge:
    forceRename: forge
    automountServiceAccountToken: true
controllers:
  app:
    replicas: 1
    strategy: RollingUpdate
    annotations:
      configmap.reloader.stakater.com/reload: forge-config
      secret.reloader.stakater.com/reload: forge-secret,openshell-client-tls
    pod:
      imagePullSecrets:
      - name: gitea-registry-secret
    serviceAccount:
      identifier: forge
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
        envFrom: &envFrom
        - secretRef:
            name: forge-secret
    containers:
      app:
        image:
          repository: gitea.a113.casa/vpogu/forge-backend
          tag: 20260911161217-d111e8a-oci
          pullPolicy: Always
        env:
          TZ: America/New_York
          FORGE_API_PORT: &httpPort 8080
          # OIDC authentication is active.
          # OIDC fields below populated in forge-secret.
          FORGE_AUTH_MODE: oidc
          FORGE_PUBLIC_URL: https://forge.${CLUSTER_DOMAIN}
          FORGE_OIDC_DISCOVERY_URL: https://id.${CLUSTER_DOMAIN}/application/o/forge/.well-known/openid-configuration
          OPENSHELL_GATEWAY_URL: https://openshell:8080
          OPENSHELL_CLIENT_CA_PATH: /etc/openshell-tls/client/ca.crt
          OPENSHELL_CLIENT_CERT_PATH: /etc/openshell-tls/client/tls.crt
          OPENSHELL_CLIENT_KEY_PATH: /etc/openshell-tls/client/tls.key
          FORGE_RUNNER: openshell
          FORGE_WORKFLOWS_DIR: /app/config
          FORGE_REPOS_CONFIG: /app/config/repos.yaml
          FORGE_DEFAULT_MODEL: openai/openai/gpt-5.6-terra
          # Managed inference (pi -> inference.local -> gateway -> provider).
          # The gateway holds real provider credentials; this placeholder key
          # overrides the 1Password INFERENCE_HUB_CODING_KEY from forge-secret
          # (individual env entries beat envFrom) and keeps the real key out of
          # sandboxes. Spark nodes swap both values at route resolution.
          INFERENCE_HUB_BASE_URL: https://inference.local
          INFERENCE_HUB_API_KEY: unused
          # Workspace routing is PARKED for the diagnostic run (2026-09-11).
          # The map below is retained for when managed inference is switched
          # on, but every model resolves to the default workspace until the
          # gateway route timeouts are reconciled with the node timeouts:
          # forge-aux is 600s while ai-review is 2400s and the feature
          # reviewer 1800s, so activating routing today would let the gateway
          # kill those nodes mid-run with the same "no result.json" symptom we
          # are currently trying to diagnose. One variable at a time.
          # FORGE_MODEL_WORKSPACES: >-
          #   switchyard/openai/gpt-5.6-terra=forge-terra,
          #   openai/openai/gpt-5.6-terra=forge-terra,
          #   azure/anthropic/claude-opus-5=forge-claude
          FORGE_DEFAULT_WORKSPACE: default
          FORGE_SPARK_BASE_URL: http://spark.a113.internal:11434
          FORGE_SPARK_API_KEY: no-key-required
          FORGE_SANDBOX_IMAGE: gitea.a113.casa/vpogu/openshell-sandbox:latest-oci@sha256:9ecae4cb7cdcc3ac3a27c56f39de9f0e4d9fbd0df104da94a7be805f5dfbd299
          FORGE_TOOL_ALLOWLIST: node,python,go,kubectl,kustomize,kubeconform,helm,uv
          FORGE_TOOL_MIRROR_HOSTS: github.com,api.github.com,objects.githubusercontent.com,release-assets.githubusercontent.com,nodejs.org,dl.k8s.io,tuf-repo-cdn.sigstore.dev,pypi.org,files.pythonhosted.org,mise-versions.jdx.dev,registry.npmjs.org,get.helm.sh
          # Relay disabled for the managed inference path (pi talks to
          # inference.local directly; the gateway owns the upstream connection).
          # Revisit sandbox OTEL after the managed path is proven.
          FORGE_OTEL_SANDBOX_ENDPOINT: ""
          FORGE_OTEL_ENDPOINT: http://alloy.observability.svc.cluster.local:4318
          # Must match the node version the environment contract installs
          # (currently 24.19.0); drift policy-denies pi/npm egress from sandboxes.
          FORGE_NPM_REGISTRY_NODE_PATH: /opt/mise/installs/node/24.19.0/bin/node
          FORGE_PYPI_REGISTRY_HOSTS: pypi.org,files.pythonhosted.org
          FORGE_HELM_REGISTRY_HOSTS: argoproj.github.io,cdn.quay.io,ceph.github.io,charts.external-secrets.io,charts.rook.io,cloudnative-pg.github.io,coroot.github.io,emberstack.github.io,ghcr.io,grafana.github.io,helm.cilium.io,helm.influxdata.com,helm.ngc.nvidia.com,mirror.gcr.io,perfectra1n.github.io,quay.io,registry.k8s.io,stakater.github.io,zapier.github.io,github.com,objects.githubusercontent.com,pkg-containers.githubusercontent.com,release-assets.githubusercontent.com,storage.googleapis.com,us-east4-docker.pkg.dev
          FORGE_HELM_PATH: /opt/mise/installs/helm/4.2.4/linux-amd64/helm
          FORGE_SKILLS_CONFIG: /app/config/skills.yaml
          FORGE_RULES_CONFIG: /app/config/rules.yaml
          FORGE_ENV_IMAGE_REPO: gitea.a113.casa/vpogu/openshell-sandbox-env
          FORGE_ZOT_ENDPOINT: zot.forge-system.svc:5000
          FORGE_REVIEWER_MODEL: azure/anthropic/claude-opus-5
          FORGE_REVIEW_MIN_CONFIDENCE: "7"
        envFrom: *envFrom
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *httpPort
              periodSeconds: 30
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: *httpPort
              periodSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: *httpPort
              initialDelaySeconds: 5
              periodSeconds: 5
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
service:
  app:
    controller: app
    ports:
      http:
        port: *httpPort
persistence:
  config:
    type: configMap
    name: forge-config
    advancedMounts:
      app:
        app:
        - path: /app/config
          readOnly: true
  openshell-client-tls:
    type: secret
    name: openshell-client-tls
    advancedMounts:
      app:
        app:
        - path: /etc/openshell-tls/client
          readOnly: true
