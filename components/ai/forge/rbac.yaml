# Environment-image bake lane (forge spec 2026-09-03 §3.4): the orchestrator
# creates short-lived bake Jobs in this namespace. Jobs self-clean via
# ttlSecondsAfterFinished; delete exists for operator cleanup only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-bake-jobs
  namespace: ai
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forge-bake-jobs
  namespace: ai
subjects:
  - kind: ServiceAccount
    name: forge
    namespace: ai
roleRef:
  kind: Role
  name: forge-bake-jobs
  apiGroup: rbac.authorization.k8s.io
