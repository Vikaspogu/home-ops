# The orchestrator creates self-cleaning environment-image bake Jobs here; delete permission is only for operator cleanup.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-bake-jobs
  namespace: ai
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forge-bake-jobs
  namespace: ai
subjects:
  - kind: ServiceAccount
    name: forge
    namespace: ai
roleRef:
  kind: Role
  name: forge-bake-jobs
  apiGroup: rbac.authorization.k8s.io
