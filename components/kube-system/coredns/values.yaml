fullnameOverride: coredns
image:
  repository: mirror.gcr.io/coredns/coredns
replicaCount: 2
k8sAppLabelOverride: kube-dns
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: "10.96.0.10"
servers:
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods verified
          fallthrough in-addr.arpa ip6.arpa
      - name: autopath
        parameters: "@kubernetes"
      # Cluster is single-stack IPv4 (pod/svc nets 10.69.0.0/16 & 10.96.0.0/16,
      # nodes IPv4-only, Cilium ipv4NativeRoutingCIDR). Upstream home DNS returns
      # AAAA records for external names (e.g. googleapis.com), which IPv4-only
      # pods cannot route to -> "dial tcp [v6]: network is unreachable" for clients
      # that don't do Happy Eyeballs fallback (Go binaries such as gog). Synthesize
      # an empty NODATA (NOERROR, no answer) reply for all AAAA queries so clients
      # use the A record only. Remove this block if the cluster ever goes dual-stack.
      - name: template
        parameters: IN AAAA
        configBlock: |-
          rcode NOERROR
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        configBlock: |-
          prefetch 20
          serve_stale
      - name: loop
      - name: reload
      - name: loadbalance
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: log
        configBlock: |-
          class error
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
