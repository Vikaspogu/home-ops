---
# Talos extensions already provide NVIDIA drivers, toolkit, libraries, and containerd runtime configuration; disable operator installation and bundled NFD while retaining runtimeClassName nvidia.

nfd:
  enabled: false

driver:
  enabled: false

toolkit:
  enabled: false

hostPaths:
  driverInstallDir: /usr/local

# Lightweight footprint for a single-GPU home cluster.
migManager:
  enabled: false

dcgm:
  enabled: false

dcgmExporter:
  enabled: false

gfd:
  enabled: true

# Keep validators enabled to verify node GPU access before scheduling workloads.
validator:
  driver:
    env:
      - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
        value: "true"
