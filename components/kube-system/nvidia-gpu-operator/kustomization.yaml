---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
helmCharts:
  - name: gpu-operator
    repo: https://helm.ngc.nvidia.com/nvidia
    version: v26.7.0
    releaseName: gpu-operator
    namespace: kube-system
    valuesFile: values.yaml
# Strip the chart ClusterPolicy and deploy it later through nvidia-gpu-cluster-policy after its CRD is registered.
patches:
  - patch: |
      $patch: delete
      apiVersion: nvidia.com/v1
      kind: ClusterPolicy
      metadata:
        name: cluster-policy
