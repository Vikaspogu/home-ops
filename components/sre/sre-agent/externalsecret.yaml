---
# 1Password item "sre-agent" must contain:
#   DPI_TOKEN           - bearer token the UI hub presents to the backend
#   SWEEP_HEARTBEAT_URL - dead-man's-switch ping URL (healthchecks.io style); its absence alert
#                         must page via the EXISTING ntfy path, independent of this app
#   OPENROUTER_API_KEY  - model API key; without it the backend sees zero models and
#                         the sweep heartbeat cannot start
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sre-agent-secret
    template:
      engineVersion: v2
      data:
        DPI_TOKEN: "{{ .DPI_TOKEN }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
        SWEEP_HEARTBEAT_URL: "{{ .SWEEP_HEARTBEAT_URL }}"
  dataFrom:
    - extract:
        key: sre-agent
