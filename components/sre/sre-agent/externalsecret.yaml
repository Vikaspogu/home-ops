---
# 1Password item "sre-agent" must contain:
#   DPI_TOKEN           - bearer token the UI hub presents to the backend
#   SWEEP_HEARTBEAT_URL - dead-man's-switch ping URL (healthchecks.io style); its absence alert
#                         must page via the EXISTING ntfy path, independent of this app
# The 1Password item "inference-hub" must contain:
#   INFERENCE_HUB_BASE_URL   - OpenAI-compatible endpoint of the Inference Hub
#   INFERENCE_HUB_CODING_KEY - API key the backend authenticates model calls with
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sre-agent-secret
    template:
      engineVersion: v2
      data:
        DPI_TOKEN: "{{ .DPI_TOKEN }}"
        SWEEP_HEARTBEAT_URL: "{{ .SWEEP_HEARTBEAT_URL }}"
  dataFrom:
    - extract:
        key: sre-agent
    - extract:
        key: inference-hub
