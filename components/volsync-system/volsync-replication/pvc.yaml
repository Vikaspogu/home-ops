---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${ARGOCD_APP_NAME}
  annotations:
    # Disable server-side diff only for this PVC so immutable restored dataSource fields do not fail ArgoCD dry-run while other resources retain server-side diff.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: ${ARGOCD_APP_NAME}-dst
  resources:
    requests:
      storage: ${ARGOCD_ENV_VOLSYNC_CAPACITY}
  storageClassName: ${ARGOCD_ENV_STORAGE_CLASS}
