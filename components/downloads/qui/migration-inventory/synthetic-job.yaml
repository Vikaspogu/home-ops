apiVersion: batch/v1
kind: Job
metadata:
  # Use a new Job identity whenever its scripts or pod template change after deployment.
  name: qui-migration-synthetic-v1
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        home-ops-migration-role: qui-synthetic
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # This group applies only to synthetic emptyDirs, never the future live-PVC inventory Job.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: &image python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          command: [python3, -B, /script/synthetic.py, writer]
          resources: &resources
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /script
              readOnly: true
            - name: fixture
              mountPath: /source
            - name: signals
              mountPath: /signals
        - name: reader
          image: *image
          command: [python3, -B, /script/synthetic.py, reader]
          resources: *resources
          securityContext: *securityContext
          volumeMounts:
            - name: scripts
              mountPath: /script
              readOnly: true
            - name: fixture
              mountPath: /source
              readOnly: true
            - name: signals
              mountPath: /signals
      volumes:
        - name: scripts
          configMap:
            name: qui-migration-synthetic-scripts
        - name: fixture
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: signals
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
