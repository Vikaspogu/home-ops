apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qui-migration-inventory-deny-all
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  podSelector:
    matchLabels:
      home-ops-migration-role: qui-inventory
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
