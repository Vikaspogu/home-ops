apiVersion: batch/v1
kind: Job
metadata:
  # Use a new Job identity for any deployed script or pod-template change.
  name: qui-migration-inventory-v1
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        home-ops-migration-role: qui-inventory
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: qui
                  app.kubernetes.io/controller: qui
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          image: python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          command: [python3, -B, /script/inventory.py]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /script
              readOnly: true
            - name: source
              mountPath: /source
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: qui-migration-inventory-scripts
        - name: source
          persistentVolumeClaim:
            claimName: qui
            readOnly: true
