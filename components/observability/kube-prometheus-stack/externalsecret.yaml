---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
  namespace: observability
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    template:
      engineVersion: v2
      data:
        NTFY_PUBLISH_TOKEN: "{{ .ALERTMANAGER_PUBLISH_TOKEN }}"
        REMEDIATION_ALERT_TOKEN: "{{ .REMEDIATION_ALERT_TOKEN }}"
  data:
    - secretKey: REMEDIATION_ALERT_TOKEN
      remoteRef:
        key: ivan
        property: REMEDIATION_ALERT_TOKEN
  dataFrom:
    - extract:
        key: ntfy
