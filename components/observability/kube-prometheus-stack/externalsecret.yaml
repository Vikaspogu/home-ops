---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
  namespace: observability
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    template:
      engineVersion: v2
      data:
        NTFY_PUBLISH_TOKEN: "{{ .ALERTMANAGER_PUBLISH_TOKEN }}"
  dataFrom:
    - extract:
        key: ntfy
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: t3-alert-webhook
  namespace: observability
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: t3-alert-webhook
    template:
      engineVersion: v2
      data:
        url: "{{ .T3_WEBHOOK_URL }}"
  dataFrom:
    - extract:
        key: t3-code
