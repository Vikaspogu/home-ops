---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy: ["alertname", "cluster", "namespace", "job", "service", "integration"]
    groupInterval: 10m
    groupWait: 1m
    receiver: ntfy
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: heartbeat
        groupInterval: 5m
        groupWait: 0s
        repeatInterval: 5m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      # ORDER MATTERS: ntfy continues to alert-manager; keep critical/warning routes adjacent.
      - receiver: ntfy
        continue: true
        matchers:
          - name: severity
            value: critical|warning
            matchType: =~
      - receiver: alert-manager
        matchers:
          - name: severity
            value: critical|warning
            matchType: =~
  inhibitRules:
    - equal: ["alertname", "namespace"]
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: "null"
    - name: heartbeat
    - name: ntfy
      webhookConfigs:
        - url: http://ntfy.default.svc.cluster.local/infra-alerts?template=infra-alerts
          sendResolved: true
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alertmanager-secret
                key: NTFY_PUBLISH_TOKEN
    - name: alert-manager
      webhookConfigs:
        # T3 scheduled task f0de4c8c-0087-40f0-bc72-275e9510a69d; URL is in 1Password item t3-code.
        - urlSecret:
            name: t3-alert-webhook
            key: url
          sendResolved: true
