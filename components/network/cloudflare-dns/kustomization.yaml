---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ExternalDNS 0.24 requires its CRD first; controller upgrades follow in PR #2576.
  - ./dnsendpoint-crd.yaml
  - ./externalsecret.yaml

helmCharts:
  - name: external-dns
    releaseName: cloudflare-dns
    namespace: network
    repo: oci://ghcr.io/home-operations/charts-mirror
    version: 1.23.0
    valuesFile: values.yaml
