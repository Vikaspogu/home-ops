---
name: ARC KubeVirt smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arc-kubevirt-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: kubevirt
    timeout-minutes: 10
    steps:
      - name: Verify ephemeral VM runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          uname -a
          echo "ARC KubeVirt runner is healthy"
